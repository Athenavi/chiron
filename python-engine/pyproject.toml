[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chiron-python-engine"
version = "0.1.260825.01"
description = "Chiron Python AI Engine - LLM Gateway / Agent推理 / RAG / 记忆管理"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Chiron Team", email = "dev@athenavi.com"},
]

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    # LLM Provider SDK（自研多 Provider 适配）
    "anthropic>=0.52.0",
    "openai>=1.93.0",
    # 向量数据库
    "pymilvus>=2.5.0",
    "qdrant-client>=1.12.0",
    # PostgreSQL (pgvector)
    "asyncpg>=0.30.0",
    # gRPC
    "grpcio>=1.70.0",
    "protobuf>=5.29.0",
    # Redis
    "redis>=5.3.0",
    # 文档处理
    "python-multipart>=0.0.20",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    # HTTP / HTML —— gateway/router.py 顶层用 aiohttp、tools/web.py 顶层用 bs4
    "aiohttp>=3.12.0",
    "beautifulsoup4>=4.13.0",
    # 图片元数据（EXIF）—— app/media/analyzer.py 的 extract_metadata 用
    "Pillow>=11.0.0",
    # 工具
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    # 认证
    "PyJWT>=2.10.0",
    # 日志
    "structlog>=25.4.0",
    # 可观测性（app/observability/metrics.py 顶层 import prometheus_client / psutil）
    "prometheus-client>=0.22.0",
    "psutil>=6.0.0",
    "opentelemetry-api>=1.33.0",
    "opentelemetry-sdk>=1.33.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.33.0",
    "opentelemetry-instrumentation-fastapi>=0.54b0",
    "opentelemetry-instrumentation-redis>=0.54b0",
    "opentelemetry-instrumentation-httpx>=0.54b0",
]

[project.optional-dependencies]
# 本地嵌入模型（RAG：配置 LOCAL_EMBEDDING_MODEL 后启用）
rag-local = [
    "sentence-transformers>=3.0.0",
]
# S3 兼容对象存储（MediaStore 的 S3 后端，MinIO 亦走此路径）—— requirements-dev.txt 引用此项
s3 = [
    "boto3>=1.40.0",
]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[project.scripts]
chiron-engine = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试函数名用中文描述断言意图（如 `test_越界异常的消息即_error_字段`）。中文没有
# 大小写概念，N802 的 lowercase 判定在这里没有意义，改写成拼音只会降低可读性。
# 仅对 tests/ 放开这一条规则，app/ 下的生产代码仍受 N802 约束。
"tests/**" = ["N802"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入**要求**把 Depends()/File() 等调用写在参数默认值里，
# B008 对这种框架惯用法是误报。ruff 官方推荐用 extend-immutable-calls
# 声明「调用结果不可变」的工厂函数。
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.11"
# 生产与 CI 都是 Linux（见 .github/workflows/ci.yml 的 ubuntu-latest），本机 Windows 只是
# 开发环境。显式声明 platform 才能让 Unix-only 的模块（如 app/tools/_sandbox_worker.py 里的
# resource.setrlimit/RLIMIT_*）被正确解析 —— 否则在 Windows 上会误报 "Module has no attribute"。
platform = "linux"
# strict 已接线但**按域分批**：CI 的 `Mypy (strict)` step 目前只检查已清零的模块，
# 完整清单与扩批进度见 docs/development-roadmap.md 的 L2-1。
# app/ 存量错误清零后改为 `mypy app/`。
strict = true
warn_return_any = true
warn_unused_configs = true

# 无类型标注（或未声明的可选）第三方依赖：这些模块既没有 py.typed，也没有可直接使用的
# stub 包 —— asyncpg / boto3 / botocore / pymupdf(fitz) / python-docx / psutil / pymilvus，
# 外加 sentence_transformers（本地嵌入的可选 extra，requirements.txt 刻意不装它）与
# pdfplumber（PDF 解析的 fallback 后端，只在 pymupdf 缺失时才 import，requirements.txt 不装）。
# 只放宽这些**模块的 import 解析**（它们的内部不参与检查），本仓库代码仍照常按 strict 检查。
# 若日后要更严的检查，可分别评估 types-psutil / asyncpg-stubs。
[[tool.mypy.overrides]]
module = ["asyncpg", "boto3.*", "botocore.*", "docx", "fitz", "langchain.*", "markitdown", "openpyxl", "pdfplumber", "psutil", "pymilvus", "qdrant_client", "sentence_transformers", "unstructured.*", "uvicorn"]
ignore_missing_imports = true

# pymupdf **自带** py.typed（与上面那些不同），但 pymupdf.open / Document 等仍缺注解 ——
# strict 的 disallow_untyped_calls 由**调用方**判定，因此豁免要落在调用它的文件上。
# 这是 pymupdf 自身的标注缺口，不是本仓库代码的问题；该文件其余检查项照常。
[[tool.mypy.overrides]]
module = ["app.rag.parser", "app.main"]
disallow_untyped_calls = false
