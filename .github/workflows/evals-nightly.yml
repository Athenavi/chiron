name: Evals (nightly)

# ── E4：评测门禁分级 ─────────────────────────────────────────────────────
#
#   smoke   ：**PR**，确定性替身 provider（零密钥、零费用）—— 在 `ci.yml` 的 `evals` job
#   full    ：**nightly / 手动**，真实模型 —— 本文件（`mode=full`）
#   compare ：**本地命令** `python -m evals.cli compare a.json b.json`（见 `evals/README.md`）
#             —— 它只读两份 JSON 打印对照表，不需要 runner，不该占 CI 分钟数。
#
# 为什么真实模型的评测**不能**作 PR 门禁：
#   1) 需要密钥与费用，而 PR 常来自 fork（拿不到 secrets）；
#   2) 质量类断言天然有波动，PR 会被随机红 —— 门禁一旦噪声化就没人看了；
#   3) `vendor/deepagents` 自己的真实模型 eval 也只是 `workflow_dispatch`：我方"smoke 作
#      PR 门禁"这一条已经是它没有的东西（评审 03 §2）。
#
# ⚠️ **首次真机运行可能还需调试**（本文件写于没有可用的 Actions 环境时）：
#   * 引擎的启动参数（端口 8000 对应 `internal/engine/python_client.go` 的默认地址）；
#   * 评测环境的模型配置 —— 本 workflow **刻意不替你选模型**：真实模型评测需要预先配好
#     可用的 LLM provider（否则引擎没有模型可用），那是部署者的决定，不是评测框架的。
on:
  schedule:
    # 每天 03:17 UTC（避开整点，减少与其它仓库抢 runner）
    - cron: '17 3 * * *'
  workflow_dispatch: # 手动触发（真实模型评测，见下方 secrets 说明）

permissions:
  contents: read

concurrency:
  group: evals-nightly
  cancel-in-progress: false # 评测跑得久，两次运行互相取消会白烧一遍 token

jobs:
  full:
    name: Full suite (real model)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chiron
          POSTGRES_PASSWORD: chiron
          POSTGRES_DB: chiron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiron -d chiron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      DATABASE_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_SECRET: ci-evals-app-secret-0123456789abcdef
      JWT_SECRET: ci-evals-jwt-secret-0123456789abcdef
      INTERNAL_TOKEN: ci-evals-internal-token-0123456789
      CHIRON_BASE_URL: http://127.0.0.1:8080
      CHIRON_ENGINE_URL: http://127.0.0.1:8000
      # 真实模型凭据（引擎侧 `app/config.py` 的 `llm_api_key`；默认 base_url 指向 DeepSeek）。
      # 换 provider / 模型是部署者的决定：按需再加 LLM_BASE_URL / LLM_MODEL 环境变量即可，
      # 评测框架不替部署者选模型。
      LLM_API_KEY: ${{ secrets.CHIRON_EVAL_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # ── 没有 secret 就**明确跳过**，而不是红 ─────────────────────────────
      # 评测需要真实模型；没有密钥时让它红，等于把"部署者没配 secrets"报成"代码退化"。
      - name: Check evaluation secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.CHIRON_EVAL_LLM_API_KEY }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHIRON_EVAL_LLM_API_KEY 未配置 —— 跳过真实模型评测（不判失败）"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply schema (alembic upgrade head)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python -m pip install -r requirements-migrate.txt
          python -m alembic -c alembic.ini upgrade head

      - name: Seed an API key for the evaluator
        # 走的是**真实用户路径**：网关按 `X-API-Key` 查 `api_keys`（sha256 hex 匹配）
        # 并 JOIN `users` 取角色与租户（internal/api/middleware.go:387-398）。
        if: steps.secrets.outputs.ready == 'true'
        run: |
          KEY="eval-ci-$(date +%s)"
          HASH=$(printf '%s' "$KEY" | sha256sum | cut -d' ' -f1)
          psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO users (id, tenant_id, email, role)
            VALUES ('eval-user', 'eval-tenant', 'eval@ci.local', 'user')
            ON CONFLICT (id) DO NOTHING;
          INSERT INTO api_keys (id, user_id, name, key_hash, revoked)
            VALUES ('eval-key', 'eval-user', 'ci-eval', '${HASH}', false);
          SQL
          echo "CHIRON_EVAL_API_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Install engine deps
        if: steps.secrets.outputs.ready == 'true'
        working-directory: python-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start engine (uvicorn :8000)
        # 引擎地址是网关侧的既有默认（internal/engine/python_client.go:105）
        if: steps.secrets.outputs.ready == 'true'
        working-directory: python-engine
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/engine.log 2>&1 &
          python - <<'PY'
          import socket, time
          for _ in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 8000), timeout=1):
                      print("engine port is open")
                      raise SystemExit(0)
              except OSError:
                  time.sleep(1)
          raise SystemExit("engine did not open port 8000 in 60s")
          PY

      - name: Start gateway
        if: steps.secrets.outputs.ready == 'true'
        run: |
          go build -mod=mod -o /tmp/chiron ./cmd/chiron
          /tmp/chiron > /tmp/gateway.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "gateway is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::gateway did not become healthy in 30s"
          tail -50 /tmp/gateway.log
          exit 1

      - name: Run full suite (real model)
        if: steps.secrets.outputs.ready == 'true'
        working-directory: python-engine
        # 退出码 0 = 全部通过 / 1 = 有任务失败。nightly **不阻塞 PR**，所以这里不让它把
        # workflow 判红 —— 报告与 summary 才是产物；红不红由人看趋势决定。
        continue-on-error: true
        run: |
          python -m evals.cli run --suite full --tier full --submit http \
            --base-url "$CHIRON_BASE_URL" --api-key "$CHIRON_EVAL_API_KEY" \
            --report evals-full-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-full-report
          path: python-engine/evals-full-report.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## Evals (full, real model)"
            echo ""
            if [ "${{ steps.secrets.outputs.ready }}" != "true" ]; then
              echo "跳过：未配置 \`CHIRON_EVAL_LLM_API_KEY\`。"
            else
              echo '```'
              python - <<'PY' || true
              import json, pathlib
              p = pathlib.Path("python-engine/evals-full-report.json")
              if not p.is_file():
                  print("no report written")
              else:
                  r = json.loads(p.read_text(encoding="utf-8"))
                  print(f"pass@k = {r.get('pass_at_k', 0):.2%}  avg@k = {r.get('avg_at_k', 0):.2%}")
                  for t in r.get("tasks", []):
                      if not t.get("passes"):
                          print(f"  FAILED {t.get('task_id')}")
              PY
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
