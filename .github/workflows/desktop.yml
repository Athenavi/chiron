# Chiron Desktop —— 三端打包并发布
#
# 为什么必须是矩阵而不是单 job 交叉编译：
#   electron-builder 不能跨平台出包（Linux 上打不出 macOS 的 .dmg / 签名链），
#   所以 Windows / macOS / Linux 各跑一个原生 runner。
#
# 触发：
#   push tag（v*）        → 三端出包 + 建 GitHub Release + 挂上产物
#   workflow_dispatch     → 三端出包，只传 artifact，不发 Release
#
# 版本号是唯一真相在 tag 上：推 v0.1.261025.01 时，
# 打包前会把 frontend-vue/package.json 的 version 改写成 0.1.261025.01，
# 这样安装包文件名、app 内 version、Release 标题三者一致。
#
# 签名与公证不在本工作流内完成（需要 Apple Developer 证书与 Windows EV 证书）。
# 未配置证书时 electron-builder 产出未签名包 —— 可自用，不可公开分发。
name: Desktop

on:
  push:
    tags: ['v*', 'V*']   # 大小写都要：本仓历史 tag 是**大写** V0.1.<YYMMDD>.<NN>
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Release 需要

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v4

      # 从 tag 推出版本号；手动触发时留空，保持 package.json 原值
      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          # 大小写都要：本仓 tag 形如 V0.1.<YYMMDD>.<NN>（大写 V）。
          # 只写 v* 时大写 tag 会被判成「非版本 tag」→ version 为空 → 产物不带版本号、
          # Release 也无法按版本命名（与 release-images.yml 踩过的是同一个坑）。
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/V* ]]; then
            echo "version=${GITHUB_REF_NAME#[vV]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend-vue/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-vue
        run: pnpm install --frozen-lockfile
        # 若 runner 所在区域拉不到 Electron，解注下面这行
        # env:
        #   ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # runner 上的 Python **只用于跑构建脚本**，不再随包任何解释器：用户机的运行时
      # 由随包的 uv 在首次启动时创建。
      #
      # 固定 3.12 是因为 desktop-local 的 pytest 套件与脚本都在这版验证过；
      # 它与用户机最终跑什么 Python 无关（那个版本由 runtime-install.cjs 决定）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # prepare_uv.py / prepare_python.py 只用标准库，但 **prepare_redis.py 不是**：
      # 它的自检要真起一次 redis 并跑契约命令，因此 `import app.config`（pydantic）
      # 与 `redis.asyncio`。此前注释写成「都只用标准库」，CI 里就没装任何依赖，
      # 于是 mac/linux 在 `from app.config import Settings` 处直接 ModuleNotFoundError。
      #
      # 这里只装**自检路径真正用到的最小集**，不 `pip install -e .`：
      # 完整依赖含 embedded-postgres / asyncpg / fastapi 等上百 MB，而构建期用不到。
      # 代价是耦合 —— 若 prepare_redis.py 的自检路径新增第三方导入，必须同步这里
      # （desktop-local/tests/test_prepare_redis_deps.py 会钉住这一点）。
      - name: Install build-script dependencies
        run: python -m pip install --upgrade pip "pydantic>=2.7" "pydantic-settings>=2.3" "redis>=5.0"

      # redis 是本地模式的必要组件（KeyRing 仲裁走 Redis 单键 Lua EVAL），
      # prepare_redis.py 只负责「把机器上已有的 redis-server 拷进 resources」，
      # 它不会替你安装 —— 所以三个平台各自先装好。
      #
      # **Windows 为什么不用 pacman**：MSYS2 仓库里只有客户端库（hiredis、
      # python-redis、redis-plus-plus），**没有任何 redis 服务端包** ——
      # packages.msys2.org/package/mingw-w64-x86_64-redis 返回 404，
      # 所以 `pacman -S mingw-w64-x86_64-redis` 必然 target not found。
      # 改用 redis-windows 自己 CI 产出的 msys2 构建：版本与 SHA256 都钉死在这里，
      # 与 scoop 的 redis bucket 取的是同一份产物（本机实测该构建可独立启动，
      # 且接受 Windows 原生 `--dir` 路径，无需 cygdrive 形式）。
      - name: Install redis-server (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $version = '8.10.3'
          $sha256 = 'AF16DF340525B431E9EC8DABFD625D5E7A233F82805B5418819904EA909C447F'
          $name = "Redis-$version-Windows-x64-msys2"
          $url = "https://github.com/redis-windows/redis-windows/releases/download/$version/$name.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'redis.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $sha256) { throw "redis 包校验失败：期望 $sha256，实际 $actual" }
          $dist = Join-Path $env:RUNNER_TEMP 'redis-dist'
          Expand-Archive -Path $zip -DestinationPath $dist -Force
          $bin = Join-Path $dist $name
          if (-not (Test-Path (Join-Path $bin 'redis-server.exe'))) {
            throw "解压后没有 redis-server.exe：$bin"
          }
          # zip 自带 msys-*.dll，prepare_redis.py 会把 exe 与同目录 DLL 一起拷走
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install redis-server (macOS)
        if: matrix.platform == 'mac'
        run: brew install redis

      - name: Install redis-server (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y redis-server

      # 先跑门禁再打包：任何一项红了都不该出安装包
      - name: Check UI contracts
        working-directory: frontend-vue
        run: pnpm check:ui

      - name: Typecheck
        working-directory: frontend-vue
        run: pnpm exec vue-tsc -b

      - name: Unit tests
        working-directory: frontend-vue
        run: pnpm test

      - name: Build frontend
        working-directory: frontend-vue
        run: pnpm exec vite build --mode desktop
        # 桌面壳用 loadFile() 从 file:// 打开 dist/index.html：vite.config.ts 在 desktop
        # 模式下把 base 设为 './'（相对路径），否则 /assets/*.js 会被解析成
        # file:///X:/assets/*.js（404 → 永久加载圈）。Web 部署仍用根绝对 base。

      # tag 是版本号的唯一真相：改写 package.json，让产物名 / app version / Release 标题一致
      - name: Stamp version into package.json
        if: steps.ver.outputs.version != ''
        working-directory: frontend-vue
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const before = p.version;
            p.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('version: ' + before + ' -> ' + p.version);
          "

      # 图标缺失时 electron-builder 不报错，会静默用 Electron 默认图标。
      # 这里提前断言，让缺资产在 CI 里直接红掉，而不是等用户装上发现是默认图标。
      - name: Verify icon assets
        shell: bash
        run: |
          for f in frontend-vue/electron/resources/icon.ico \
                   frontend-vue/electron/resources/icon.png; do
            if [[ ! -s "$f" ]]; then
              echo "::error::missing or empty: $f"
              exit 1
            fi
            echo "ok  $f  $(wc -c < "$f") bytes"
          done

      # 就位随包的 uv 二进制与 redis 二进制。**必须在 electron-builder 之前跑**：
      #   1) 这两份产物都不进 git，CI checkout 上根本没有；
      #   2) electron-builder 对缺失的 `extraResources.from` 只 warn 不报错
      #      （app-builder-lib out/fileMatcher.js: `statOrNull(from)` 为 null 时
      #      `log.warn(...)` 后直接 return），所以缺了也照样出包 —— 打出的是残包。
      # 两个脚本自带"真实跑一次"的自检，失败即退出非零，把问题挡在出包之前。
      #
      # **必须显式传 --platform**，不能让脚本按 runner 自己推断：
      #   - `macos-latest` 现在是 arm64 runner，而 electron-builder.yml 的 mac
      #     target 是 arch: [x64] —— 自动推断会装成 darwin-arm64，打进 x64 包里
      #     就是一份跑不起来的二进制；
      #   - win/linux runner 目前是 x64，同样按 target 走而不是按 runner 走。
      - name: Prepare bundled uv binary
        working-directory: desktop-local
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            win)   key=win32-x64 ;;
            mac)   key=darwin-x64 ;;
            linux) key=linux-x64 ;;
            *) echo "::error::未知平台 ${{ matrix.platform }}"; exit 1 ;;
          esac
          echo "uv platform key = $key"
          python scripts/prepare_uv.py --platform "$key"

      # 解释器也要随包。只带 uv 不够：`uv venv --python <ver> --python-preference
      # only-managed` 在本地没有受管 CPython 时会去 GitHub Releases 下载
      # python-build-standalone，而不少网络下 github.com 不可达 ⇒ 首次启动永远卡在
      # 创建环境。随包一份纯解释器后，运行时用它的绝对路径建 venv，不再联网找解释器；
      # 依赖仍按 pyproject.toml 首次现装。
      #
      # 同样**必须显式传 --platform**，理由与上一步一致（runner 架构 ≠ target 架构）。
      - name: Prepare bundled CPython interpreter
        working-directory: desktop-local
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            win)   key=win32-x64 ;;
            mac)   key=darwin-x64 ;;
            linux) key=linux-x64 ;;
            *) echo "::error::未知平台 ${{ matrix.platform }}"; exit 1 ;;
          esac
          echo "python platform key = $key"
          python scripts/prepare_python.py --platform "$key"

      - name: Prepare bundled redis binary
        working-directory: desktop-local
        run: python scripts/prepare_redis.py

      - name: Package desktop app
        working-directory: frontend-vue
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 出包之后再断言一次：上面那两个 `from` 目录如果因为任何原因没生成，
      # electron-builder 只会 warn，产物照样"成功"。这里按**安装包里的真实路径**检查，
      # 缺任何一项就让 CI 红掉，而不是等用户装上发现本地模式起不来。
      - name: Verify packaged runtime assets
        shell: bash
        run: |
          # 每个平台 electron-builder 解开后的目录名不同，统一用 win-unpacked /
          # mac / linux-unpacked 三种去找。
          root=""
          for d in frontend-vue/release/win-unpacked frontend-vue/release/mac \
                   frontend-vue/release/linux-unpacked; do
            if [[ -d "$d/resources" ]]; then root="$d/resources"; break; fi
          done
          if [[ -z "$root" ]]; then
            echo "::error::找不到解包后的 resources 目录，打包可能没产出"
            ls -la frontend-vue/release || true
            exit 1
          fi
          echo "resources = $root"

          fail=0
          need=(
            "desktop-local/app/main.py"
            "desktop-local/pyproject.toml"
            "migrations"
            "alembic.ini"
          )
          # pyproject.toml 必须在包里：首次启动时 uv 就是靠它装依赖的，
          # 缺了它能装出一个空环境，然后表现为"依赖装完了但导不进来"。
          for p in "${need[@]}"; do
            if [[ ! -e "$root/$p" ]]; then
              echo "::error::缺少 $root/$p"
              fail=1
            else
              echo "ok  $p"
            fi
          done

          # 随包的 uv 二进制（首次启动自装运行时的唯一入口）。
          # 目录键必须与 runtime-install.cjs::bundledUv() 的
          # `${process.platform}-${process.arch}` 逐字一致，写错等于没有 uv。
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            uv="$root/uv/win32-x64/uv.exe"
            redis="$root/desktop-local/bin/redis/redis-server.exe"
          elif [[ "${{ matrix.platform }}" == "mac" ]]; then
            uv="$root/uv/darwin-x64/uv"
            redis="$root/desktop-local/bin/redis/redis-server"
          else
            uv="$root/uv/linux-x64/uv"
            redis="$root/desktop-local/bin/redis/redis-server"
          fi
          for p in "$uv" "$redis"; do
            if [[ ! -e "$p" ]]; then
              echo "::error::缺少 $p —— 首次启动装不出运行时 / 本地模式起不来"
              fail=1
            else
              echo "ok  ${p#"$root/"}"
            fi
          done

          # uv 不只是"文件在"，还得真能执行：CI 的 runner 架构与目标架构不同
          # （macos-latest 是 arm64，target 是 x64），拿错架构的二进制会在这里暴露。
          if [[ -e "$uv" ]]; then
            if "$uv" --version; then
              echo "ok  uv 可执行"
            else
              echo "::error::$uv 无法执行（架构不匹配或缺少可执行位）"
              fail=1
            fi
          fi

          # **随包的受管 CPython 解释器**：首次启动建 venv 要用它的绝对路径，
          # 否则 uv 会去 GitHub 下载（github.com 不可达的网络下必然失败）。
          # 布局必须与 runtime-install.cjs::bundledPython() 一致：
          #   resources/python-runtime/<platform>-<arch>/<版本目录>/python[.exe]
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            pyroot="$root/python-runtime/win32-x64"
          elif [[ "${{ matrix.platform }}" == "mac" ]]; then
            pyroot="$root/python-runtime/darwin-x64"
          else
            pyroot="$root/python-runtime/linux-x64"
          fi
          pyexe="$(find "$pyroot" -maxdepth 3 -name 'python.exe' -o -maxdepth 3 -name 'python3' 2>/dev/null | head -1)"
          if [[ -z "$pyexe" ]]; then
            echo "::error::缺少随包解释器 $pyroot —— 首次启动将无法创建环境"
            ls -la "$pyroot" 2>/dev/null || true
            fail=1
          else
            echo "ok  ${pyexe#"$root/"}"
            if "$pyexe" -c "import sys" 2>/dev/null; then
              echo "ok  随包解释器可执行（$("$pyexe" -V 2>&1)）"
            else
              echo "::error::$pyexe 无法执行（架构不匹配或缺少依赖）"
              fail=1
            fi
          fi

          # **不复用旧的 resources/python**：那是"解释器 + 已装依赖"的整包，
          # 会冻结构建机状态、漏一个包就整体失效。这里反向断言它没有被加回来。
          if [[ -e "$root/python" ]]; then
            echo "::error::安装包里仍然带着 resources/python —— 旧形态已废弃，应为 python-runtime"
            fail=1
          else
            echo "ok  未随包旧的 resources/python（符合预期）"
          fi

          exit "$fail"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chiron-desktop-${{ matrix.platform }}
          if-no-files-found: error
          # 只收 x64 安装包与更新清单：electron-builder 仍会在 release/ 下留 blockmap
          # 与 builder-debug.yml，这里用精确文件名把它们挡在 artifact 之外，
          # Release 也就不会出现一堆无关文件。
          path: |
            frontend-vue/release/*-win-x64.exe
            frontend-vue/release/*-mac-x64.dmg
            frontend-vue/release/*-linux-x86_64.AppImage
            frontend-vue/release/*-linux-amd64.deb
            frontend-vue/release/latest.yml
            frontend-vue/release/latest-mac.yml
            frontend-vue/release/latest-linux.yml

  release:
    name: publish release
    needs: build
    # 两个大小写都要：build 的触发条件是 v*/V*，本仓历史 tag 用大写 V
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest
    steps:
      # 必须 fetch-depth: 0 —— checkout 默认只拉 1 个 commit，
      # 读不到 prevTag..curTag 之间的提交，变更说明就会是空的。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected files
        run: ls -lh artifacts

      # 从上个 tag 到本次 tag 的提交生成变更说明（Conventional Commits 分类）
      - name: Generate changelog from git history
        run: |
          node .github/scripts/changelog.mjs "$GITHUB_REF_NAME" > changelog.md
          echo '--- changelog preview ---'
          cat changelog.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Chiron ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: changelog.md
          generate_release_notes: false # 用我们自己的说明，不要 GitHub 的 PR 摘要
          draft: true # 先存为草稿，人工确认签名状况后再公开
          files: artifacts/**/*
