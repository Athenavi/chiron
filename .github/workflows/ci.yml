name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  # 同一分支的新推送取消旧的进行中运行，避免排队堆积
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go 网关 ──────────────────────────────────────────────────────────────
  go:
    name: Go gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # `-mod=mod` 是必需的：仓库里的 vendor/ 放的是参考源码（vendor/DeepSeek-Reasonix，
      # 不含 vendor/modules.txt），Go 只要看到 vendor/ 就会按 vendor 模式做一致性检查
      # 并报 "inconsistent vendoring"。run.py / Makefile / Dockerfile 同样显式排除了它。
      - run: go build -mod=mod ./...
      - run: go vet -mod=mod ./...
      - run: go test -mod=mod ./... -count=1

  # ── Python 引擎 ─────────────────────────────────────────────────────────
  python:
    name: Python engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 刻意用**声明下限**而不是最新版：pyproject 写的是 requires-python >= 3.11，
          # 用 3.11 才能挡住 3.12+ 才有的语法（历史缺陷：milvus_store.py 用了 PEP 701
          # 的嵌套引号 f-string，在 3.11 上 import 即 SyntaxError）。
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # 测试与静态检查依赖统一走 requirements-dev.txt（与 pyproject 的 [dev] extra 对齐）。
          # 此前在 workflow 里手写 `pip install 'pytest>=8.4.0' 'ruff>=0.11.0'`，与两份清单各自漂移 ——
          # 依赖一旦有单一来源，加一个测试工具就只需改一处。
          python -m pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (strict)
        # 全量门禁：25 批分批接线已把 app/ 的 1171 条存量清零，不再需要按域列清单
        # （此前用 --follow-imports=silent + 显式列表，是因为未清零模块的依赖闭包不可控）。
        # 分批过程与踩过的坑见 docs/contributing.md「mypy strict 接线手册」。
        # 本机复核仍会报 2 条环境相关错误（CI 不会出现，见该手册末尾），以 CI 结果为准。
        #
        # acp_adapter/ 是可选的 ACP 适配层（依赖不在主清单里），同样纳入门禁 ——
        # 可选依赖用 `# type: ignore[import-not-found]` 标注，不需要为了它改全局配置；
        # 反过来，不纳入门禁的代码迟早会腐烂。
        run: mypy app/ acp_adapter/
      - name: Pytest
        # integration 用例需要完整栈（网关 HTTP / 真实 PG），见 pyproject 的 markers。
        # 它们由需要时单独执行：`pytest -m integration`
        run: python -m pytest -q -m "not integration"

  # ── 评测骨架（smoke 集）─────────────────────────────────────────────────
  #
  # PR 门禁：用**确定性替身 provider** 跑 smoke 集 —— 零密钥、零费用、可判定。
  # 这一步是 deepagents 都没有的：它的真实模型 eval 只在 workflow_dispatch 下触发
  # （libs/evals/.github/workflows/evals.yml:4）。
  #
  # 它验证的是「固件 → runner → 断言 → 报告」这条链路，因此**不需要任何第三方依赖**
  # 就能跑（httpx 已在 evals/submit.py 里改为延迟导入，只有 --submit http 才需要）。
  # **agent 能力必须用真实模型另跑**（`--submit http`，需网关 + 引擎；尚未接线）。
  evals:
    name: Evals (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Smoke suite (scripted provider)
        # 退出码 0 = 全部通过 / 1 = 有任务失败，CI 直接可用
        run: python -m evals.cli run --suite smoke --submit scripted --report evals-report.json
      - name: Upload report
        # 失败时也要拿到报告（否则只能看日志里的摘要）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-smoke-report
          path: python-engine/evals-report.json
          if-no-files-found: warn

  # ── 前端 ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm run lint
      # 契约棘轮（z-index / 主题 token / 动效 token / i18n / a11y）+ vue-tsc + vite build
      - name: UI contracts + typecheck + build
        run: pnpm run build
      - name: Unit tests
        run: pnpm run test

  # ── 迁移链整体性 ─────────────────────────────────────────────────────────
  schema:
    name: Migration chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-migrate.txt
      # migrations/versions 必须只有**一个** head：分叉会让启动校验
      # （internal/db/schema_version.go 的 ParseMigrationHead）直接拒绝启动。
      - name: Single alembic head
        run: |
          out="$(python -m alembic -c alembic.ini heads)"
          echo "$out"
          count="$(printf '%s\n' "$out" | grep -c '(head)')"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 alembic head, found $count"
            exit 1
          fi
      # 迁移文件本身必须可被 Alembic 解析（离线模式不连库）。
      # ⚠ **离线渲染仍然需要"方言"**：本 job 没有 env、`alembic.ini` 的 `sqlalchemy.url`
      # 是注释状态、`migrations/env.py` 取不到 URL 就返回 None ⇒ alembic 直接抛
      # "Connection, url, or dialect_name is required."。**2026-10-09 本机实测：这一步按原样
      # 在 CI 里必然红**（exit 1）。下面给一个**假 DSN**：只用于确定方言，不会去连库；
      # 给了之后渲染出 81 个 CREATE TABLE / 164 个 ALTER TABLE、exit 0（同为本机实测）。
      - name: Migration renders offline
        env:
          DATABASE_DSN: postgresql://chiron:chiron@localhost:5432/chiron
        run: python -m alembic -c alembic.ini upgrade head --sql > /dev/null
      # ORM 模型 ↔ 迁移 DDL 的**列集合**：`check_orm_models.py` 只保证「yaml ↔ 生成物」，
      # 而第 68 轮那次漂移的**方向**是「迁移有、yaml 没有」—— 那时无人守。2026-10-09 实测：
      # 补之前 `DDL 有、模型没有` = **12 列 / 5 表**（`sessions` 的 6 个分支血缘列 · `turns` 的
      # `model`/`cache_hit`/`cached_tokens` · `messages.source` · `subagent_runs.rerun_of` ·
      # `unified_sessions.runtime`），补完双向为 0。不建模的表走**显式白名单**（脚本里的
      # `UNMODELED`，当前 10 张）—— 新增一张却忘了建模 ⇒ 这里直接红，不静默放过。
      # 放在本 job：它本来就在渲染 DDL，且装了 alembic（encoding job 没有）。
      # 已做变异验证（删一列 ⇒ exit 1 并点名 `sessions: ['branch_from_seq']`）。
      - name: ORM models match migration DDL
        env:
          DATABASE_DSN: postgresql://chiron:chiron@localhost:5432/chiron
        run: python scripts/check_orm_schema.py

  # ── 源码编码 ────────────────────────────────────────────────────────────
  encoding:
    name: Source encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # U+FFFD / 非法 UTF-8 是**字节已损坏**的信号，不是排版问题：
      # python-engine/pyproject.toml 曾因此把 anthropic / pymilvus / prometheus-client
      # 三个依赖吞进注释行；frontend-vue/nginx.conf 则被吞掉 5 条配置指令
      # （client_max_body_size、location /assets/、location / 等），大括号失衡导致
      # frontend 容器直接起不来 —— 而前端 CI 只跑 dist 相关的 lint/build/test，全无察觉。
      - name: Encoding guard (U+FFFD / invalid UTF-8)
        run: python scripts/check_source_encoding.py
      # Go 侧（权威判定）与 Python 侧（保守镜像）的判定表**必须同构**。两者语言
      # 不同、无法共享代码，此前只有一行注释约定 —— 并且已经漂移过
      # （read_tool_result / list_subagent_runs / rerun_subagent）。见路线图 L3-9。
      # 2026-10-09 起**同时覆盖另外四族**：对话模式（Go `validAgentModes` ↔ 引擎
      # `AgentMode` 枚举 ↔ `_BASE_MODES` 覆盖，见 docs/session-runtime-spec.md §3）·
      # 模型服务提供商目录（Go `llmProviderCatalog` ↔ 引擎 `providers/catalog.py`，
      # 见 docs/service-providers.md §1）· 故障注入的作用面/类型（Go `chaosSupported*`
      # ↔ 引擎 `chaos/injector.py`，见 internal/api/ent_chaos_handler.go 文件头）·
      # **共享 Redis 键前缀**（`subagent:run:` / `subagent:cancel:ack:` / `engine:instance:`；
      # 两侧各自都有测试钉住自己那份字面量 ⇒ 只改一侧时容易两边都绿而漂移上线）·
      # **共享数值常量**（`defaultBranchKeepTail`/`minCondenseMessages` ↔ 引擎
      # `DEFAULT_KEEP_TAIL`/`MIN_COMPRESSIBLE_MESSAGES`，同一个陷阱）·
      # **工具授权模式**（唯一一条**三语言**约定：Go `mode.go` ↔ 引擎 `guards.py` ↔
      # 前端 `ChatView.vue` 的联合类型；做集合比对，只在一侧新增模式也会被拦下）。
      - name: Go-Python-TS parity (tables, modes, keys, constants)
        run: python scripts/check_tool_policy_parity.py
      # scripts/ 此前**没有任何 lint 门禁**（本 job 只跑上面两个守卫），于是攒下 8 处历史问题
      # （未用变量/未用导入/裸 except…），现已清零并纳入门禁。规则集与引擎一致（配置见仓库根
      # ruff.toml；python-engine 有自己的 pyproject.toml，就近优先，互不影响）。
      - name: Ruff (repo-root scripts)
        run: |
          pip install --quiet 'ruff>=0.11.0'
          ruff check scripts/
      # 文档断链：被引用的 docs/*.md 必须存在。曾一次扫出 19 份**从未提交过**的设计文档
      # （代码注释里写着"见某份设计文档"，读者去找只会扑空）。存量 19 条走基线白名单
      # （scripts/doc_link_baseline.txt，**只应缩小**），新增断链直接失败 —— 已用变异验证。
      - name: Doc links (referenced docs must exist)
        run: python scripts/check_doc_links.py
      # Markdown 表格结构：同一表格块内每行的列数必须一致。手写的表格**多一个 / 少一个 `|`
      # 不会让 Markdown 报错** —— 只是静默错位（看着"差不多"）。实测在
      # docs/development-roadmap.md §3 抓到两处：一行多了一个分隔符、另一行少了行尾 `|`，
      # 而当时四个守卫没有一个覆盖这个类别。存量基线（scripts/md_tables_baseline.txt，
      # **只应缩小**）当前为**空** ⇒ 新增不一致直接失败（已做变异验证）。
      - name: Markdown tables (consistent column counts)
        run: python scripts/check_md_tables.py
      # 错误码键集：Go `Code*` 必须与三语言 `errors.ts` 的契约键一致，且三语言键集完全相同。
      # docs/error-codes.md 把这条写成**硬要求**，却自陈"目前靠人工核对" —— 缺一个键不会有
      # 任何报错，只有该语言的用户会看到未本地化的原文。存量基线为空（当前一致）。
      - name: Error code keys (Go Code* vs 3 locales)
        run: python scripts/check_error_code_keys.py
      # ORM 生成物新鲜度：`shared/models/**` 是**生成物**（`scripts/generate_orm_models.py`
      # ← `configs/orm/V1/models.yaml`），却**既不在 ruff/mypy 门禁内，也没有任何用例提到它**
      # （全仓只有生成器自己提它）。漂移过一次：`shared/models/subagent_run.py` 缺 7 列
      # （`inherited_messages` / `retryable` / `output_bytes` / `validator_*` / `error_code`），
      # 而迁移 0004/0006/0007 里都有 —— 靠人肉核对才发现。判据：把生成器重跑到**临时目录**
      # 再逐文件比对，**只忽略模板的「生成时间」行**（它每次运行都不同；第 68 轮就是它造成
      # 69 个文件的纯时间戳噪声）。已做变异验证（删一列 ⇒ exit 1 并点名行号）。
      - name: ORM models match models.yaml
        run: python scripts/check_orm_models.py
      # compose 必填环境变量必须有文档：`docker-compose.yml` 里用 `${VAR:?…}` 声明的变量
      # （compose 缺失时直接报错）必须在 `.env.example` 出现（**注释形态也算** —— 模板里
      # 可选/推荐项本来就是注释的）。判据是**先量过假阳性率**才定的：compose 引用了 29 个变量，
      # 但只有 **7** 个是 `:?`，其余 22 个都带 `:-默认值`（可选覆盖）；若要求"全部 29 个都要有文档"，
      # 会为 9 个**有默认值**的可选变量报假阳性（S3_BUCKET / VECTOR_DB_TYPE / MILVUS_ADDRESS …，
      # 而 `.env.example` 自己写明"业务/基础设施配置已迁移至后台「系统设置」"）—— 那种守卫会惩罚
      # **正确的文档**。已做变异验证（拿掉 `#JWT_SECRET=` ⇒ exit 1 并点名）。
      - name: Compose required env vars are documented
        run: python scripts/check_compose_env.py

  # ── 真实栈集成（L2-2）───────────────────────────────────────────────────────
  # 两侧的 live 测试此前都被永久跳过：Go 侧没有 CHIRON_TEST_POSTGRES_DSN，Python 侧
  # 只跑 -m "not integration" —— 覆盖支付入账/回退、设置持久化、工作流落库、统一
  # DB/Redis 客户端这些高风险路径的断言因此从未真正执行过。本 job 把它们跑起来：
  #   * PostgreSQL / Redis 用 services 起（compose 里没有 PG，故自建）；
  #   * schema 用 alembic 建 —— 与发布流程同一个入口，顺带验证迁移在空库上能跑通；
  #   * Python 的 UnifiedDBClient / UnifiedRedisClient 走的是 Go 网关的
  #     /v1/internal/{db,redis}/*，所以网关也要拉起来（build 后后台跑，等 /health）；
  #   * APP_SECRET 必须 ≥32 字符，否则网关拒绝启动（internal/config 的 fail fast）。
  integration:
    name: Real-stack integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chiron
          POSTGRES_PASSWORD: chiron
          POSTGRES_DB: chiron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiron -d chiron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 同一份 DSN 喂三处：网关（POSTGRES_DSN）、alembic（DATABASE_DSN 优先）、Go live 测试
      POSTGRES_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      DATABASE_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      CHIRON_TEST_POSTGRES_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_SECRET: ci-integration-app-secret-0123456789abcdef
      JWT_SECRET: ci-integration-jwt-secret-0123456789abcdef
      INTERNAL_TOKEN: ci-integration-internal-token-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply schema (alembic upgrade head)
        run: |
          python -m pip install -r requirements-migrate.txt
          python -m alembic -c alembic.ini upgrade head

      - name: Go live tests (real PostgreSQL + Redis)
        # -run 只挑真实库用例（Live/Diag）：其余用例与 go job 重复，不必再跑一遍
        # broadcast：断线重放/跨实例补发；engine：session→实例归属（审批/取消路由依据）；
        # 两者都走 REDIS_URL，此前没有真实 Redis 覆盖（docs/dsh-gap-analysis.md 切口 #1）。
        run: go test -mod=mod ./internal/api/... ./internal/billing/... ./internal/settings/... ./internal/broadcast/... ./internal/engine/... -count=1 -run 'Live|Diag' -v

      - name: Build and start gateway
        run: |
          go build -mod=mod -o /tmp/chiron ./cmd/chiron
          /tmp/chiron > /tmp/gateway.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "gateway is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::gateway did not become healthy in 30s"
          tail -50 /tmp/gateway.log
          exit 1

      - name: Install engine deps
        working-directory: python-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Python integration tests (real stack)
        working-directory: python-engine
        run: python -m pytest -q -m integration

      - name: Cross-instance drill (two gateway processes)
        # **两个真实网关进程** + Redis：跨实例扇出、实时不重复、断线重连补发不重复。
        # 此前这一格只有"进程内双 hub"用例（internal/api/sse_cross_instance_live_test.go）——
        # 2026-10-08 正是这个演练挖出了"多实例重复投递"缺陷（实时与重放都 N 份）。
        # 用上面已构建好的 /tmp/chiron，不再重复编译。
        working-directory: python-engine
        run: python tests/drills/multi_instance_drill.py /tmp/chiron
