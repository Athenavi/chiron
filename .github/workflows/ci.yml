name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  # 同一分支的新推送取消旧的进行中运行，避免排队堆积
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go 网关 ──────────────────────────────────────────────────────────────
  go:
    name: Go gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # `-mod=mod` 是必需的：仓库里的 vendor/ 放的是参考源码（vendor/DeepSeek-Reasonix，
      # 不含 vendor/modules.txt），Go 只要看到 vendor/ 就会按 vendor 模式做一致性检查
      # 并报 "inconsistent vendoring"。run.py / Makefile / Dockerfile 同样显式排除了它。
      - run: go build -mod=mod ./...
      - run: go vet -mod=mod ./...
      - run: go test -mod=mod ./... -count=1

  # ── Python 引擎 ─────────────────────────────────────────────────────────
  python:
    name: Python engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 刻意用**声明下限**而不是最新版：pyproject 写的是 requires-python >= 3.11，
          # 用 3.11 才能挡住 3.12+ 才有的语法（历史缺陷：milvus_store.py 用了 PEP 701
          # 的嵌套引号 f-string，在 3.11 上 import 即 SyntaxError）。
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # 测试与静态检查依赖统一走 requirements-dev.txt（与 pyproject 的 [dev] extra 对齐）。
          # 此前在 workflow 里手写 `pip install 'pytest>=8.4.0' 'ruff>=0.11.0'`，与两份清单各自漂移 ——
          # 依赖一旦有单一来源，加一个测试工具就只需改一处。
          python -m pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (strict)
        # 全量门禁：25 批分批接线已把 app/ 的 1171 条存量清零，不再需要按域列清单
        # （此前用 --follow-imports=silent + 显式列表，是因为未清零模块的依赖闭包不可控）。
        # 分批过程与踩过的坑见 docs/contributing.md「mypy strict 接线手册」。
        # 本机复核仍会报 2 条环境相关错误（CI 不会出现，见该手册末尾），以 CI 结果为准。
        run: mypy app/
      - name: Pytest
        # integration 用例需要完整栈（网关 HTTP / 真实 PG），见 pyproject 的 markers。
        # 它们由需要时单独执行：`pytest -m integration`
        run: python -m pytest -q -m "not integration"

  # ── 评测骨架（smoke 集）─────────────────────────────────────────────────
  #
  # PR 门禁：用**确定性替身 provider** 跑 smoke 集 —— 零密钥、零费用、可判定。
  # 这一步是 deepagents 都没有的：它的真实模型 eval 只在 workflow_dispatch 下触发
  # （libs/evals/.github/workflows/evals.yml:4）。
  #
  # 它验证的是「固件 → runner → 断言 → 报告」这条链路，因此**不需要任何第三方依赖**
  # 就能跑（httpx 已在 evals/submit.py 里改为延迟导入，只有 --submit http 才需要）。
  # **agent 能力必须用真实模型另跑**（`--submit http`，需网关 + 引擎；尚未接线）。
  evals:
    name: Evals (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Smoke suite (scripted provider)
        # 退出码 0 = 全部通过 / 1 = 有任务失败，CI 直接可用
        run: python -m evals.cli run --suite smoke --submit scripted --report evals-report.json
      - name: Upload report
        # 失败时也要拿到报告（否则只能看日志里的摘要）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-smoke-report
          path: python-engine/evals-report.json
          if-no-files-found: warn

  # ── 前端 ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm run lint
      # 契约棘轮（z-index / 主题 token / 动效 token / i18n / a11y）+ vue-tsc + vite build
      - name: UI contracts + typecheck + build
        run: pnpm run build
      - name: Unit tests
        run: pnpm run test

  # ── 迁移链整体性 ─────────────────────────────────────────────────────────
  schema:
    name: Migration chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-migrate.txt
      # migrations/versions 必须只有**一个** head：分叉会让启动校验
      # （internal/db/schema_version.go 的 ParseMigrationHead）直接拒绝启动。
      - name: Single alembic head
        run: |
          out="$(python -m alembic -c alembic.ini heads)"
          echo "$out"
          count="$(printf '%s\n' "$out" | grep -c '(head)')"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 alembic head, found $count"
            exit 1
          fi
      # 迁移文件本身必须可被 Alembic 解析（离线模式不连库）
      - name: Migration renders offline
        run: python -m alembic -c alembic.ini upgrade head --sql > /dev/null

  # ── 源码编码 ────────────────────────────────────────────────────────────
  encoding:
    name: Source encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # U+FFFD / 非法 UTF-8 是**字节已损坏**的信号，不是排版问题：
      # python-engine/pyproject.toml 曾因此把 anthropic / pymilvus / prometheus-client
      # 三个依赖吞进注释行；frontend-vue/nginx.conf 则被吞掉 5 条配置指令
      # （client_max_body_size、location /assets/、location / 等），大括号失衡导致
      # frontend 容器直接起不来 —— 而前端 CI 只跑 dist 相关的 lint/build/test，全无察觉。
      - name: Encoding guard (U+FFFD / invalid UTF-8)
        run: python scripts/check_source_encoding.py

  # ── 真实栈集成（L2-2）───────────────────────────────────────────────────────
  # 两侧的 live 测试此前都被永久跳过：Go 侧没有 CHIRON_TEST_POSTGRES_DSN，Python 侧
  # 只跑 -m "not integration" —— 覆盖支付入账/回退、设置持久化、工作流落库、统一
  # DB/Redis 客户端这些高风险路径的断言因此从未真正执行过。本 job 把它们跑起来：
  #   * PostgreSQL / Redis 用 services 起（compose 里没有 PG，故自建）；
  #   * schema 用 alembic 建 —— 与发布流程同一个入口，顺带验证迁移在空库上能跑通；
  #   * Python 的 UnifiedDBClient / UnifiedRedisClient 走的是 Go 网关的
  #     /v1/internal/{db,redis}/*，所以网关也要拉起来（build 后后台跑，等 /health）；
  #   * APP_SECRET 必须 ≥32 字符，否则网关拒绝启动（internal/config 的 fail fast）。
  integration:
    name: Real-stack integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chiron
          POSTGRES_PASSWORD: chiron
          POSTGRES_DB: chiron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiron -d chiron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 同一份 DSN 喂三处：网关（POSTGRES_DSN）、alembic（DATABASE_DSN 优先）、Go live 测试
      POSTGRES_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      DATABASE_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      CHIRON_TEST_POSTGRES_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_SECRET: ci-integration-app-secret-0123456789abcdef
      JWT_SECRET: ci-integration-jwt-secret-0123456789abcdef
      INTERNAL_TOKEN: ci-integration-internal-token-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply schema (alembic upgrade head)
        run: |
          python -m pip install -r requirements-migrate.txt
          python -m alembic -c alembic.ini upgrade head

      - name: Go live tests (real PostgreSQL)
        # -run 只挑真实库用例（Live/Diag）：其余用例与 go job 重复，不必再跑一遍
        run: go test -mod=mod ./internal/api/... ./internal/billing/... ./internal/settings/... -count=1 -run 'Live|Diag' -v

      - name: Build and start gateway
        run: |
          go build -mod=mod -o /tmp/chiron ./cmd/chiron
          /tmp/chiron > /tmp/gateway.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "gateway is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::gateway did not become healthy in 30s"
          tail -50 /tmp/gateway.log
          exit 1

      - name: Install engine deps
        working-directory: python-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Python integration tests (real stack)
        working-directory: python-engine
        run: python -m pytest -q -m integration
