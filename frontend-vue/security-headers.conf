# 安全响应头片段 —— 由 nginx.conf 的 server 级与各静态 location `include`。
#
# ## 为什么必须是独立片段
#
# nginx 的 `add_header` 一旦在**子块**出现，就**完全覆盖父级**的同名指令集合。
# 所以任何自带 `add_header` 的 location（`= /index.html`、`/assets/`、字体、图片、
# `= /sw.js`、`/health`）都必须再 include 一次，否则那些响应会**丢失全部安全头**。
#
# 此前 `location = /index.html` 只带了 Cache-Control/Pragma/Expires，而 SPA 路由
# `location /` 的 `try_files` 正是内部重定向到它 —— 结果是**主页没有任何安全头**：
# 没有 CSP（全站失去 XSS 兜底）、没有 X-Frame-Options（任意站点可 iframe 嵌套做点击劫持）。

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP：限制资源加载源，防止 XSS/数据注入
# 生产部署建议把 connect-src / img-src 收窄到实际 API 与 CDN 域名
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
# HSTS：生产 HTTPS 部署启用（HTTP 下会被忽略）
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
