# 安全响应头片段 —— 由 nginx.conf 的 server 级与各静态 location `include`。
#
# ## 为什么必须是独立片段
#
# nginx 的 `add_header` 一旦在**子块**出现，就**完全覆盖父级**的同名指令集合。
# 所以任何自带 `add_header` 的 location（`= /index.html`、`/assets/`、字体、图片、
# `= /sw.js`、`/health`）都必须再 include 一次，否则那些响应会**丢失全部安全头**。
#
# 此前 `location = /index.html` 只带了 Cache-Control/Pragma/Expires，而 SPA 路由
# `location /` 的 `try_files` 正是内部重定向到它 —— 结果是**主页没有任何安全头**：
# 没有 CSP（全站失去 XSS 兜底）、没有 X-Frame-Options（任意站点可 iframe 嵌套做点击劫持）。

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP：限制资源加载源，防止 XSS/数据注入。
#
# connect-src 已收窄到 'self' + ws/wss（**不再允许任意 https:**）—— 前端只与自身 API
# 通信，之前的 `https:` 通配等于给 XSS 留了一条任意外发通道（fetch 到攻击者域名带走
# token）。若后续要接第三方 API（如浏览器直连模型服务），请在此**显式列出域名**，
# 不要退回通配。
#
# img-src 仍保留 `https:`：对话里的 Markdown 外链图片需要能显示。若要彻底防外链数据
# 外泄，可收窄为 `'self' data: blob:`，代价是外链图片不再显示。
#
# 另：若启用图形验证码（Cloudflare Turnstile / reCAPTCHA / hCaptcha），需按所选服务商
# 在 script-src 与 frame-src 里显式加入其域名 —— 当前 `script-src 'self'` 会拦住
# CaptchaWidget 动态加载的验证码脚本。
# CSS：`style-src 'self'` 只允许**来自本站**的 `<style>`/样式表（Vue SFC 样式在构建期
# 抽成 .css，属 'self'）；内联 `style="..."` 属性单独由 `style-src-attr` 放开 ——
# Ant Design / Vue 运行时会给元素加内联属性，但这类属性不构成脚本执行面，
# 相比整条 `style-src ... 'unsafe-inline'` 收窄了「注入 <style> 覆盖全站」的可能。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
# HSTS：生产 HTTPS 部署启用（HTTP 下会被忽略）
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
