<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 独立配置页：不加载前端 dist/，也不依赖任何网络资源 —— 它存在的意义
         正是"还没有可用的服务地址"。样式沿用主应用的纸色底与 clay 主色。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Chiron — 连接服务</title>
    <style>
      :root {
        --bg-page: #f9f9f7;
        --bg-card: #ffffff;
        --text-primary: #1f1f1c;
        --text-secondary: #5c5c56;
        --text-tertiary: #8a8a82;
        --border: #e6e6e1;
        --primary: #d97757;
        --primary-hover: #cc5a36;
        --error: #d14343;
        --success: #2f855a;
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-page: #1a1a19;
          --bg-card: #20201f;
          --text-primary: #f0efe9;
          --text-secondary: #a8a8a0;
          --text-tertiary: #75756e;
          --border: #333330;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-page);
        color: var(--text-primary);
        font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(440px, calc(100vw - 48px));
        padding: 28px 28px 22px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
      p.lead { margin: 0 0 20px; color: var(--text-secondary); font-size: 13px; }
      label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-secondary); font-weight: 500; }
      input[type="url"] {
        width: 100%;
        padding: 9px 11px;
        font: inherit;
        color: var(--text-primary);
        background: var(--bg-page);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        outline: none;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }
      input[type="url"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
      }
      .hint { margin: 8px 0 0; font-size: 12px; color: var(--text-tertiary); }
      .status { min-height: 20px; margin: 14px 0 0; font-size: 12.5px; }
      .status.error { color: var(--error); }
      .status.ok { color: var(--success); }
      .status.busy { color: var(--text-secondary); }
      .actions { display: flex; gap: 10px; margin-top: 18px; }
      button {
        flex: 1;
        padding: 9px 14px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-secondary);
        transition: border-color 120ms ease, color 120ms ease, background-color 120ms ease;
      }
      button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
      button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
      button.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      .actions.sub { margin-top: 10px; }
      .actions.sub button { font-size: 12.5px; }
    </style>
  </head>
  <body>
    <main>
      <h1>连接 Chiron 服务</h1>
      <p class="lead">桌面客户端需要知道你的 Chiron 服务地址。填写后随时可以在「设置 → 运行模式」里改回来。</p>

      <label for="url">服务地址</label>
      <input id="url" type="url" placeholder="http://127.0.0.1:8080" autocomplete="off" spellcheck="false" />
      <p class="hint">
        自托管通常填本机地址；也可填局域网或公网地址。服务还没起来也没关系 ——
        地址可以直接保存，起来之后重新测试即可。
      </p>

      <div id="status" class="status"></div>

      <div class="actions">
        <button id="test" type="button">测试连接</button>
        <button id="save" type="button" class="primary" disabled>保存并进入</button>
      </div>
      <!-- 这个页面常常是当时唯一的窗口：没有出口，地址填错的人就被锁在这里 -->
      <div class="actions sub">
        <button id="local" type="button">改用本地模式</button>
      </div>
    </main>

    <script>
      const urlInput = document.getElementById('url')
      const statusEl = document.getElementById('status')
      const testBtn = document.getElementById('test')
      const saveBtn = document.getElementById('save')
      const localBtn = document.getElementById('local')
      const host = window.chironDesktop || {}

      let pending = false // 有一个动作正跑着（测连接 / 保存 / 切模式）
      let verified = '' // 最近一次测试通过的地址，只用于状态提示，不再挡保存

      function setStatus(text, kind) {
        statusEl.textContent = text
        statusEl.className = 'status' + (kind ? ' ' + kind : '')
      }

      /** 与服务端 normalizeApiUrl 同口径：只认 http(s)，主进程那份拒绝的这里也别想存 */
      function isStorableUrl(raw) {
        if (!raw) return false
        try {
          const parsed = new URL(raw)
          return parsed.protocol === 'http:' || parsed.protocol === 'https:'
        } catch {
          return false
        }
      }

      /**
       * 按钮状态只有一个真相来源：地址格式合法 + 没有动作在跑。
       *
       * 旧判据是「必须先测通、且测的还是当前这个地址」。前半条太硬：服务还没起来、
       * 端口写错、探测被防火墙挡住的时刻，恰恰就是最需要把地址存下来的时刻，
       * 而硬闸门把用户钉在页面上 —— 存不了、也走不掉。后半条（测 A 存 B）仍然保留：
       * 保存的永远是当前输入框里的值，改一个字就作废上次测试结果。
       */
      function sync() {
        const value = urlInput.value.trim()
        if (verified && value !== verified) {
          verified = ''
          if (!pending) setStatus('')
        }
        urlInput.disabled = pending
        testBtn.disabled = pending
        saveBtn.disabled = pending || !isStorableUrl(value)
        localBtn.disabled = pending
      }

      urlInput.addEventListener('input', sync)

      // 预填当前地址：看不见旧地址就谈不上"改"它 —— 从本地模式切过来时，
      // config.json 里往往正留着一个上个时代留下的地址。
      void (async () => {
        try {
          const settings = await host.getDeviceSettings()
          if (settings && settings.apiUrl && !urlInput.value) {
            urlInput.value = settings.apiUrl
            setStatus('当前地址：' + settings.apiUrl, 'busy')
          }
        } catch {
          /* 旧外壳没有这个接口：当作没配过 */
        }
        sync()
        urlInput.focus()
      })()

      testBtn.addEventListener('click', async () => {
        const value = urlInput.value.trim()
        if (!value) {
          setStatus('请先填写服务地址', 'error')
          return
        }
        pending = true
        sync()
        setStatus('正在连接…', 'busy')
        try {
          await host.testApiUrl(value)
          verified = value
          setStatus('连接成功', 'ok')
        } catch (err) {
          verified = ''
          setStatus(
            String(err && err.message ? err.message : err) + '（地址照样可以保存，服务起来后再测）',
            'error',
          )
        } finally {
          pending = false
          sync()
        }
      })

      saveBtn.addEventListener('click', async () => {
        const value = urlInput.value.trim()
        if (!isStorableUrl(value)) return
        pending = true
        sync()
        setStatus('正在保存…', 'busy')
        try {
          await host.setApiUrl(value)
          setStatus('已保存，正在进入…', 'ok')
        } catch (err) {
          setStatus(String(err && err.message ? err.message : err), 'error')
          pending = false
          sync()
        }
      })

      // 回本地：模式切换由主进程执行（清云端分区 + 写盘 + 重启），这里只收集意图
      localBtn.addEventListener('click', async () => {
        pending = true
        sync()
        setStatus('正在切换到本地模式…', 'busy')
        try {
          await host.setMode('local', {})
          await host.restart()
        } catch (err) {
          setStatus(String(err && err.message ? err.message : err), 'error')
          pending = false
          sync()
        }
      })
    </script>
  </body>
</html>
