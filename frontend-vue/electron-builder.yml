# Chiron Desktop 打包配置（electron-builder）
#
# 形态：**自带本地服务栈**的桌面应用。安装包同时携带
#   - `dist/` + `electron/`（前端与主进程，进 asar）；
#   - `chiron.exe`（Go 网关，本地模式的唯一业务入口）；
#   - `desktop-local/`（引导器 + `bin/` 下的 PG/Redis 二进制）；
#   - `python-engine/`（聊天/知识库/记忆/图谱的实现方）；
#   - `python-runtime/` + `uv/`（裸 CPython 与建 venv 的工具）。
# 首启不下载任何东西，只在本机建 venv 装依赖，详见 docs/desktop-local/packaging.md。
# 版本号采用 V0.1.261025.01 的语义：0.1 起步 → 261025 日期 → 01 当日序号。
#
# 发行策略：每个平台只出 x64 安装包 + latest*.yml 更新清单。
#   - 不再生成 arm64 产物：macOS ARM 用户由系统提示走 Rosetta 运行 x64 包；
#   - 不生成双架构合并安装包（electron-builder 的 universal installer，体积≈两倍）；
#   - 不生成 .blockmap（差分更新文件），自动更新仍可用，只是每次全量下载。
appId: com.chiron.agent
productName: Chiron
copyright: Copyright © 2026 Chiron

directories:
  output: release
  buildResources: electron/resources

# 只收运行期真正需要的东西
#
# **排除 node_modules**：前端运行时依赖（vue / echarts / mermaid / three …）已经由
# Vite 打进 dist/，package.json 的 dependencies 只是构建期输入。把它们再整包塞进
# asar 会让产物膨胀到 800MB+（实测 863MB app.asar / 1.3GB win-unpacked）。
#
# 代价：`electron-updater` 也被排除，且**未签名构建本来就不能自动更新**。
# main.cjs 的 setupAutoUpdater 已有 try/catch，require 失败只记一条 warn 并跳过，
# 不影响启动。签名接入后再按 `docs/desktop-local/packaging.md` 的白名单加回。
files:
  - electron/**/*
  - dist/**/*
  - package.json
  - "!node_modules/**"

# 安装包产物体积不因此膨胀
asar: true

# 本地模式的可选组件（core / pageindex / langextract）放到 resources/components/，
# 由主进程按需拉起（见 docs/desktop-local/contracts.md §3、§4）。
#
# 用 `from: .` + glob 过滤而不是 `from: components`：组件目录平时并不存在
# （二进制由 W4 的 components.cjs 在应用内下载，不进仓库），直接指向不存在的目录
# 会让 electron-builder 在拷贝阶段报错。glob 过滤匹配不到文件时只是「不带组件」，
# 目录将来出现则自动落到 resources/components/，构建永远不需要因为缺目录而改配置。
extraResources:
  # Go 网关：本地模式的**唯一业务入口**。
  #
  # 放 resources/ 而不是 asar：它是原生可执行文件，asar 里无法直接执行
  # （asar 是归档格式，只有 Node 的 fs 能透明读取，OS 无法 exec 归档内的文件）。
  # 主进程按 `path.join(process.resourcesPath, 'chiron.exe')` 定位（见 main.cjs
  # 的 resolveGatewayExe），两侧路径必须一致。
  #
  # 仓库根的 chiron.exe 是构建产物（`*.exe` 不入库），所以这里用 glob 过滤：
  # 匹配不到时只是"不带网关"，构建不会因为缺文件而失败 —— 与 components/ 同一套取舍。
  - from: ..
    to: .
    filter:
      - "chiron.exe"
      - "chiron"
  - from: .
    to: .
    filter:
      - "components/**/*"
      - "!components/**/.gitkeep"
  # 受管 CPython 解释器：引导器与 python-engine 共用这一份。
  #
  # 由 `desktop-local/scripts/prepare_python.py` 在打包前就位
  # （`assets/python-runtime/<platform>/`，当前约 66MB）。
  # 放 resources 而不是 asar：它是原生可执行文件，asar 内的文件无法被 OS 执行。
  # 主进程按 `path.join(process.resourcesPath, 'python-runtime', '<plat>', ...)` 定位。
  - from: assets/python-runtime
    to: python-runtime
    filter:
      - "**/*"
  # uv：仅用于**在该随包解释器之上建 venv 并装依赖**，不再用来下载解释器。
  # 由 `desktop-local/scripts/prepare_uv.py` 就位（`assets/uv/<platform>/uv.exe`）。
  - from: assets/uv
    to: uv
    filter:
      - "**/*"
  # 本地 core 源码（不放进 asar：Python 子进程需要真实文件路径）。
  # `desktop-local/app/config.py` 的 REPO_ROOT = resources/，所以 migrations/
  # 必须放在 resources/migrations，否则启动时找不到迁移目录。
  #
  # **同时携带 `bin/` 下的 PG 与 Redis 二进制**：它们在 `desktop-local/bin/`，
  # 是 `**/*` 的一部分，因此随这条规则一起进包。这两个目录由
  # `scripts/prepare_pg.py` 与 `scripts/prepare_redis.py` 在打包前就位，
  # 仓库里不存在（`.gitignore` 忽略 `desktop-local/bin/`），所以打包机上必须先跑它们。
  - from: ../desktop-local
    to: desktop-local
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/.pytest_cache/**"
      - "!**/*.egg-info/**"
      - "!**/.venv/**"
      # 不写 `!**/bin/**`：`bin/` 下的 PG 与 Redis 二进制是**刻意随包**的，
      # 由 `**/*` 一并收进来。将来扩充排除规则时，别把它排掉。
  - from: ../migrations
    to: migrations
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  # python-engine：聊天、知识库、记忆、图谱、能力发现的**唯一实现方**。
  #
  # 网关那 230 条路由里有 38 条（16.5%）要转给它，其中 memory/graphs/chat/
  # capabilities/workflows 是 100% 依赖 —— 不带它，用户点这些入口只会拿到
  # `python engine not available`，这正是"本地模式几乎不可用"的成因
  # （见 docs/desktop-local/endpoint-coverage.md）。
  #
  # 同样放 resources/ 而非 asar：它是 Python 源码目录，由子进程以
  # `python -m app.main` 在真实路径下运行，asar 内的路径子进程读不到。
  # 不带 tests/ evals/ examples/ docs：那些是开发期资产，进包只是白占体积。
  - from: ../python-engine
    to: python-engine
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/.pytest_cache/**"
      - "!**/*.egg-info/**"
      - "!**/.venv/**"
      - "!tests/**"
      - "!evals/**"
      - "!examples/**"
      - "!logs/**"
      - "!out/**"
      - "!data/**"
  - from: ../alembic.ini
    to: alembic.ini
  # **安装包携带一份 CPython 与 uv**（都不是运行时依赖的替代品，而是必需品）：
  #   - `resources/python-runtime/<platform>/cpython-*/`：受管解释器，由
  #     `desktop-local/scripts/prepare_python.py` 在打包前就位（约 66MB）；
  #   - `resources/uv/<platform>/uv.exe`：只用来在解释器之上建 venv 并装依赖
  #     （`prepare_uv.py`），**不再**用来下载解释器。
  # 首启只做"建 venv + 按 pyproject.toml 装依赖"，两步都不碰 CPython 下载，
  # 因此即使 github.com 不可达也能装起来；依赖装到 userData/local/runtime/venv。
  # 体积换的是确定性：不会因为构建机/用户机 Python 版本不符而失效。
  # CI 另有一步按安装包内真实路径复核运行时资产确实在包里。


# Chromium 通过 file:// / Worker 直接读取 wasm 与 viewer 资源；
# asar 内路径在这些加载器下不稳定，显式解包（不影响 asar 主体）。
asarUnpack:
  - dist/assets/*.wasm
  - dist/vendor/**

# 关掉不需要的高风险开关。asar 完整性校验保持关闭：当前产物未签名，
# 开启 enableEmbeddedAsarIntegrityValidation 会导致启动失败，签名接入后再开。
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 不生成 .blockmap：发行包只留安装包与 latest.yml
  differentialPackage: false
  # 即使将来重新加入多架构，也不生成体积翻倍的合并安装包（Chiron-*-win.exe）
  buildUniversalInstaller: false

mac:
  target:
    - target: dmg
      arch: [x64]
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # 未配置证书时 electron-builder 会自动跳过签名；正式分发需填入 Apple Developer 身份并走 notarytool 公证
  hardenedRuntime: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# 自动更新：electron-updater 从 GitHub Releases 读取 latest*.yml。
# CI 仍用 --publish never 构建，由 release job 统一上传资产。
publish:
  provider: github
  owner: Athenavi
  repo: chiron
