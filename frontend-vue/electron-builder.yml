# Chiron Desktop 打包配置（electron-builder）
#
# 形态：纯 Web 壳。只把 dist/ 与 electron/ 打进安装包，不打包 Go 后端或 Python。
# 版本号采用 V0.1.261025.01 的语义：0.1 起步 → 261025 日期 → 01 当日序号。
#
# 发行策略：每个平台只出 x64 安装包 + latest*.yml 更新清单。
#   - 不再生成 arm64 产物：macOS ARM 用户由系统提示走 Rosetta 运行 x64 包；
#   - 不生成双架构合并安装包（electron-builder 的 universal installer，体积≈两倍）；
#   - 不生成 .blockmap（差分更新文件），自动更新仍可用，只是每次全量下载。
appId: com.chiron.agent
productName: Chiron
copyright: Copyright © 2026 Chiron

directories:
  output: release
  buildResources: electron/resources

# 只收运行期真正需要的东西
#
# **排除 node_modules**：前端运行时依赖（vue / echarts / mermaid / three …）已经由
# Vite 打进 dist/，package.json 的 dependencies 只是构建期输入。把它们再整包塞进
# asar 会让产物膨胀到 800MB+（实测 863MB app.asar / 1.3GB win-unpacked）。
#
# 代价：`electron-updater` 也被排除，且**未签名构建本来就不能自动更新**。
# main.cjs 的 setupAutoUpdater 已有 try/catch，require 失败只记一条 warn 并跳过，
# 不影响启动。签名接入后再按 `docs/desktop-local/packaging.md` 的白名单加回。
files:
  - electron/**/*
  - dist/**/*
  - package.json
  - "!node_modules/**"

# 安装包产物体积不因此膨胀
asar: true

# 本地模式的可选组件（core / pageindex / langextract）放到 resources/components/，
# 由主进程按需拉起（见 docs/desktop-local/contracts.md §3、§4）。
#
# 用 `from: .` + glob 过滤而不是 `from: components`：组件目录平时并不存在
# （二进制由 W4 的 components.cjs 在应用内下载，不进仓库），直接指向不存在的目录
# 会让 electron-builder 在拷贝阶段报错。glob 过滤匹配不到文件时只是「不带组件」，
# 目录将来出现则自动落到 resources/components/，构建永远不需要因为缺目录而改配置。
extraResources:
  - from: .
    to: .
    filter:
      - "components/**/*"
      - "!components/**/.gitkeep"
  # 本地 core 源码（不放进 asar：Python 子进程需要真实文件路径）。
  # `desktop-local/app/config.py` 的 REPO_ROOT = resources/，所以 migrations/
  # 必须放在 resources/migrations，否则启动时找不到迁移目录。
  - from: ../desktop-local
    to: desktop-local
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/.pytest_cache/**"
      - "!**/*.egg-info/**"
      - "!**/.venv/**"
  - from: ../migrations
    to: migrations
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  - from: ../alembic.ini
    to: alembic.ini
  # 随包的 Python 运行时（解释器 + desktop-local 全部依赖 + embedded-postgres 自带的
  # PG 二进制）。由 `desktop-local/scripts/prepare_python_runtime.py` 生成：
  #   resources/python/python.exe         ← bundledPython() 认这个路径
  #   resources/python/Lib/site-packages/ ← fastapi / asyncpg / embedded_postgres …
  #
  # 没有它用户机必然起不来 core：`bundledPython()` 找不到资源，会回退到 PATH 上的
  # `python`，而多数 Windows 机器只有 Microsoft Store 占位符；即便有解释器也没装
  # fastapi/asyncpg，结果是 `ModuleNotFoundError`。这正是"本地模式全部页面报服务繁忙"
  # 的底层原因之一。
  #
  # 该目录不进 git（约 150MB 构建产物），打包脚本会在 electron-builder 之前调用
  # prepare_python_runtime.py 生成它，见 package.json 的 desktop:pack / desktop:dist。
  - from: python-runtime
    to: python
    filter:
      - "**/*"
      - "!**/__pycache__/**"


# Chromium 通过 file:// / Worker 直接读取 wasm 与 viewer 资源；
# asar 内路径在这些加载器下不稳定，显式解包（不影响 asar 主体）。
asarUnpack:
  - dist/assets/*.wasm
  - dist/vendor/**

# 关掉不需要的高风险开关。asar 完整性校验保持关闭：当前产物未签名，
# 开启 enableEmbeddedAsarIntegrityValidation 会导致启动失败，签名接入后再开。
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 不生成 .blockmap：发行包只留安装包与 latest.yml
  differentialPackage: false
  # 即使将来重新加入多架构，也不生成体积翻倍的合并安装包（Chiron-*-win.exe）
  buildUniversalInstaller: false

mac:
  target:
    - target: dmg
      arch: [x64]
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # 未配置证书时 electron-builder 会自动跳过签名；正式分发需填入 Apple Developer 身份并走 notarytool 公证
  hardenedRuntime: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# 自动更新：electron-updater 从 GitHub Releases 读取 latest*.yml。
# CI 仍用 --publish never 构建，由 release job 统一上传资产。
publish:
  provider: github
  owner: Athenavi
  repo: chiron
