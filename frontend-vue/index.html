<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- 字体由 @fontsource-variable/geist 本地打包，无需预连接外部字体源 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#151517" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Chiron AI Agent 工作平台</title>
    <style>
      /* 启动加载动画 - 减少白屏时间 */
      #app:empty::before {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 3px solid var(--loading-bg, #1a1a1a);
        border-top-color: var(--loading-color, #00ccaa);
        border-radius: 50%;
        animation: app-loading 0.8s linear infinite;
      }
      @keyframes app-loading {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
      /* 确保加载期间有背景色 */
      body {
        background: #fafafa;
        margin: 0;
        padding: 0;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #151517; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
