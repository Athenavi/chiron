server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 上游网关:Docker 内嵌 DNS 在 127.0.0.11。
    # 用"变量式 proxy_pass + resolver"强制每次请求重新解析 gateway:
    # --scale gateway=N 扩容、或副本重建换 IP 后 nginx 自动跟随;
    # 静态写法 proxy_pass http://gateway:8080 只在启动时解析一次并钉死单个副本。
    # K8s 部署请把 resolver 改为 kube-dns 的 ClusterIP(如 10.96.0.10)。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chiron_gateway gateway:8080;

    # ── 安全 headers（S 安全加固）──
    # 防止点击劫持、MIME 嗅探、XSS 过滤
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：限制资源加载源，防止 XSS/数据注入
    # 生产部署需将 connect-src 改为实际 API 域名
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    # HSTS：生产 HTTPS 部署启用（HTTP 下会被忽略）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 上传限制（S 安全加固：防大文件 DoS）──
    # 默认 50MB，足够文档/图片上传；视频请用专用端点
    client_max_body_size 50m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Service Worker - 缓存策略
    location = /sw.js {
        # Service Worker 文件不缓存，确保及时更新
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 图片资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 字体资源缓存
    location ~* \.(woff2?|ttf|eot|otf)$ {
        expires 365d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html - 入口不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # ── API 代理（同域部署用）──
    # 后端路由前缀 /v1/，nginx 反向代理到 gateway
    location /v1/ {
        proxy_pass http://$chiron_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 读取超时（SSE/长轮询需要）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 代理（流式响应）
    location /events {
        proxy_pass http://$chiron_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        # SSE 长连接超时
        proxy_read_timeout 3600s;
    }

    # 即时对话/取消(无 /v1 前缀,由网关处理; S 修复: 此前 /submit 未代理,SSE 发送打回 index.html)
    location /submit {
        proxy_pass http://$chiron_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # cancel: 即时对话停止(无 /v1 前缀)
    location /cancel {
        proxy_pass http://$chiron_gateway;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # 媒体文件(公开 + 签名短链)由网关托底(S 修复: 此前 /media/ 未代理,媒体图 404)
    location /media/ {
        proxy_pass http://$chiron_gateway;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://$chiron_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 健康检查（负载均衡器探活）
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA 路由（前端 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 安全加固：隐藏 nginx 版本 ──
    server_tokens off;
}
