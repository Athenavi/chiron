        type: string
        maxLength: 255
        description: 目标
      key_results:
        type: object
        description: 关键结果（JSONB）
        default: '[]'
      quarter:
        type: string
        maxLength: 16
        description: 季度
        default: ''
      status:
        type: string
        maxLength: 16
        description: 状态
        default: 'active'
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()

  SupportTicket:
