# ORM 模型定义 (V1)
# 所有 orm: true 的模型将自动生成 SQLAlchemy 模型文件

models:
  AgentRegistry:
    table: agent_registry
    orm: true
    description: Agent 注册表
    properties:
      agent_type:
        type: string
        maxLength: 32
        description: Agent 类型
        primary_key: true
      name:
        type: string
        maxLength: 128
        description: 名称
      description:
        type: text
        description: 描述
        default: ''
      enabled:
        type: boolean
        description: 是否启用
        default: true
      config:
        type: object
        description: JSON 配置
        default: '{}'
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()

  GuestStorage:
    table: guest_storage
    orm: true
    description: 访客存储
    properties:
      client_id:
        type: string
        maxLength: 64
        description: 客户端 ID
        primary_key: true
      storage_id:
        type: string
        maxLength: 64
        description: 存储 ID
        unique: true
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()

  StripePayment:
    table: stripe_payments
    orm: true
    description: Stripe 支付记录
    properties:
      session_id:
        type: string
        maxLength: 128
        description: 会话 ID
        primary_key: true
      user_id:
        type: string
        format: uuid
        description: 用户 ID
        maxLength: 36
      credits:
        type: integer
        description: Credits 数量
        default: 1000
      amount_cents:
        type: integer
        description: 金额（分）
        db_type: bigint
        default: 0
      status:
        type: string
        maxLength: 16
        description: 状态
        default: 'pending'
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      completed_at:
        type: string
        format: date-time
        description: 完成时间
        nullable: true

  Tenant:
    table: tenants
    orm: true
    description: 租户
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        primary_key: true
        default: gen_random_uuid()
      name:
        type: string
        maxLength: 255
        description: 租户名称
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      status:
        type: string
        maxLength: 16
        description: 状态
        default: 'active'

  Agent:
    table: agents
    orm: true
    description: Agent 配置
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: Agent ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      name:
        type: string
        maxLength: 255
        description: 名称
      description:
        type: text
        description: 描述
        nullable: true
      system_prompt:
        type: text
        description: 系统提示词
        nullable: true
      tools:
        type: object
        db_type: jsonb
        description: 工具配置（JSONB）
        default: '[]'
      llm_config:
        type: object
        db_type: jsonb
        description: LLM 配置（JSONB）
        default: '{}'
      max_turns:
        type: integer
        description: 最大轮次
        default: 10
      timeout_seconds:
        type: integer
        description: 超时秒数
        default: 120
      enabled:
        type: boolean
        description: 是否启用
        default: true
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()
      user_id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
      visibility:
        type: string
        maxLength: 16
        description: 可见性
        default: 'private'
      kind:
        type: string
        maxLength: 16
        description: 类型（chat=可对话 Agent，subagent=子 Agent Profile）
        default: chat
      # 以下 4 列由迁移添加（3b8e5f1a7c94 / 7d21b9c4e8f3 / c2d4e6f8a1b3），
      # 但一直漏在 models.yaml 之外 —— 真实表与生成的 ORM 模型因此长期不一致。
      # Go 网关直接写 SQL 不受影响，Python 侧经 ORM 读取则拿不到这些列。
      kb_id:
        type: string
        description: 默认知识库 ID（派发时用于 RAG 检索）
        nullable: true
      skills:
        type: object
        db_type: jsonb
        description: 技能名数组（派发时只启用这些技能）
        default: '[]'
      plugins:
        type: object
        db_type: jsonb
        description: MCP server 名数组（派发时只放这些插件提供的工具）
        default: '[]'
      workflows:
        type: object
        db_type: jsonb
        description: 工作流 ID 数组（派发时按顺序执行）
        default: '[]'

  SubagentRun:
    table: subagent_runs
    orm: true
    description: 子 Agent 运行（run 级元数据 + L1 精简摘要）
    properties:
      id:
        type: string
        maxLength: 64
        description: 运行 ID（rs_ 前缀）
        primary_key: true
      root_session_id:
        type: string
        maxLength: 128
        description: 归属会话 ID（递归树根）
      turn_id:
        type: string
        maxLength: 64
        description: 归属回合 ID（计费归因）
        nullable: true
      parent_run_id:
        type: string
        maxLength: 64
        description: 父运行 ID（顶层委派为空）
        nullable: true
      depth:
        type: integer
        description: 递归深度（顶层为 1）
        default: 1
      tenant_id:
        type: string
        maxLength: 36
        description: 租户 ID
        nullable: true
      user_id:
        type: string
        maxLength: 36
        description: 用户 ID
        nullable: true
      agent_id:
        type: string
        maxLength: 36
        description: Profile 引用（agents.id）
        foreign_key: true
        fk_table: agents
        fk_column: id
        nullable: true
      profile_name:
        type: string
        maxLength: 128
        description: Profile 名（冗余，便于展示与审计）
        nullable: true
      task:
        type: text
        description: 委派任务原文
      status:
        type: string
        maxLength: 16
        description: 状态（queued/running/completed/failed/cancelled/timeout/budget_exceeded）
      summary:
        type: text
        description: L1 有效消息（经 LLM 整理，唯一进入父上下文的内容）
        nullable: true
      summary_format:
        type: string
        maxLength: 16
        description: 摘要格式
        default: markdown
      artifacts:
        type: object
        db_type: jsonb
        description: 产物引用（[{path,bytes}]）
        default: '[]'
      write_paths:
        type: object
        db_type: jsonb
        description: 写入路径声明（并发互斥用）
        default: '[]'
      read_only:
        type: boolean
        description: 是否只读运行（剥离写工具）
        default: false
      input_tokens:
        type: integer
        db_type: bigint
        description: 输入 Tokens
        default: 0
      output_tokens:
        type: integer
        db_type: bigint
        description: 输出 Tokens
        default: 0
      steps:
        type: integer
        description: 步数
        default: 0
      cost_cents:
        type: integer
        description: 费用（分）
        default: 0
      redacted_count:
        type: integer
        description: 入库前命中的敏感片段数
        default: 0
      error:
        type: text
        description: 失败原因（不静默）
        nullable: true
      started_at:
        type: string
        format: date-time
        description: 开始时间
        nullable: true
      finished_at:
        type: string
        format: date-time
        description: 结束时间
        nullable: true
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()

  SubagentRunStep:
    table: subagent_run_steps
    orm: true
    description: 子 Agent 完整调用过程（L0 逐 step）
    properties:
      id:
        type: integer
        description: 自增 ID
        primary_key: true
        autoincrement: true
        db_type: bigserial
      run_id:
        type: string
        maxLength: 64
        description: 所属运行 ID
        foreign_key: true
        fk_table: subagent_runs
        fk_column: id
      seq:
        type: integer
        description: 步序（run 内唯一）
      kind:
        type: string
        maxLength: 16
        description: 步骤类型（message/reasoning/tool_call/tool_result/notice/error）
      role:
        type: string
        maxLength: 16
        description: 消息角色
        nullable: true
      tool_name:
        type: string
        maxLength: 64
        description: 工具名
        nullable: true
      tool_call_id:
        type: string
        maxLength: 128
        description: 工具调用 ID
        nullable: true
      content:
        type: text
        description: 单步内容（截断上限 32KB）
        nullable: true
      truncated:
        type: boolean
        description: 内容是否被截断
        default: false
      input_tokens:
        type: integer
        description: 输入 Tokens
        default: 0
      output_tokens:
        type: integer
        description: 输出 Tokens
        default: 0
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()

  EnterpriseTask:
    table: enterprise_tasks
    orm: true
    description: 企业任务
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 任务 ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      user_id:
        type: string
        maxLength: 36
        description: 用户 ID
        default: ''
      title:
        type: string
        maxLength: 255
        description: 标题
      description:
        type: text
        description: 描述
        default: ''
      project:
        type: string
        maxLength: 128
        description: 项目
        default: ''
      assignee:
        type: string
        maxLength: 128
        description: 负责人
        default: ''
      priority:
        type: string
        maxLength: 16
        description: 优先级
        default: 'medium'
      status:
        type: string
        maxLength: 16
        description: 状态
        default: 'open'
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()

  KbArticle:
    table: kb_articles
    orm: true
    description: 知识库文章
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 文章 ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      user_id:
        type: string
        maxLength: 36
        description: 用户 ID
        default: ''
      title:
        type: string
        maxLength: 255
        description: 标题
      content:
        type: text
        description: 内容
        default: ''
      tags:
        type: array
        description: 标签
        default: '[]'
      category:
        type: string
        maxLength: 64
        description: 分类
        default: ''
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()

  MarketingCampaign:
    table: marketing_campaigns
    orm: true
    description: 营销活动
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 活动 ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      user_id:
        type: string
        maxLength: 36
        description: 用户 ID
        default: ''
      name:
        type: string
        maxLength: 255
        description: 名称
      description:
        type: text
        description: 描述
        default: ''
      campaign_type:
        type: string
        maxLength: 32
        description: 活动类型
        default: 'email'
      config:
        type: object
        description: JSON 配置
        default: '{}'
      status:
        type: string
        maxLength: 16
        description: 状态
        default: 'draft'
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()

  MediaAsset:
    table: media_assets
    orm: true
    description: 媒体资源
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 资源 ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      user_id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
      type:
        type: string
        maxLength: 16
        description: 类型
        default: 'text'
      name:
        type: string
        maxLength: 255
        description: 名称
      file_url:
        type: string
        maxLength: 1024
        description: 文件 URL
        default: ''
      file_path:
        type: string
        maxLength: 512
        description: 文件路径
        default: ''
      mime_type:
        type: string
        maxLength: 64
        description: MIME 类型
        default: ''
      thumbnail:
        type: string
        maxLength: 512
        description: 缩略图
        default: ''
      metadata:
        type: object
        description: 元数据（JSONB）
        default: '{}'
      tags:
        type: array
        description: 标签
        default: '[]'
      category:
        type: string
        maxLength: 64
        description: 分类
        default: ''
      size:
        type: integer
        description: 文件大小
        db_type: bigint
        default: 0
      created_at:
        type: datetime
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: datetime
        format: date-time
        description: 更新时间
        default: now()
      parent_id:
        type: string
        maxLength: 64
        description: 父资源 ID
        default: ''

  MeetingNote:
    table: meeting_notes
    orm: true
    description: 会议记录
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 记录 ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      user_id:
        type: string
        maxLength: 36
        description: 用户 ID
        default: ''
      title:
        type: string
        maxLength: 255
        description: 标题
      notes:
        type: text
        description: 笔记内容
        default: ''
      summary:
        type: text
        description: 摘要
        nullable: true
      participants:
        type: array
        description: 参与者
        default: '[]'
      date:
        type: string
        format: date
        description: 日期
        default: 'CURRENT_DATE'
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()

