      status:
        type: string
        maxLength: 16
        description: 状态
        default: 'pending'
      result:
        type: text
        description: 结果
        nullable: true
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
