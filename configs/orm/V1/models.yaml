# ORM 模型定义 (V1)
# 所有 orm: true 的模型将自动生成 SQLAlchemy 模型文件

models:
  Tenant:
    table: tenants
    orm: true
    description: 租户
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        primary_key: true
        default: gen_random_uuid()
      name:
        type: string
        maxLength: 255
        description: 租户名称
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      status:
        type: string
        maxLength: 16
        description: 状态
        default: 'active'

  Agent:
    table: agents
    orm: true
    description: Agent 配置
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: Agent ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      name:
        type: string
        maxLength: 255
        description: 名称
      description:
        type: text
        description: 描述
        nullable: true
      system_prompt:
        type: text
        description: 系统提示词
        nullable: true
      tools:
        type: object
        db_type: jsonb
        description: 工具配置（JSONB）
        default: '[]'
      llm_config:
        type: object
        db_type: jsonb
        description: LLM 配置（JSONB）
        default: '{}'
      max_turns:
        type: integer
        description: 最大轮次
        default: 10
      timeout_seconds:
        type: integer
        description: 超时秒数
        default: 120
      enabled:
        type: boolean
        description: 是否启用
        default: true
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()
      user_id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
      visibility:
        type: string
        maxLength: 16
        description: 可见性
        default: 'private'
      kind:
        type: string
        maxLength: 16
        description: 类型（chat=可对话 Agent，subagent=子 Agent Profile）
        default: chat
      # 以下 4 列由迁移添加（3b8e5f1a7c94 / 7d21b9c4e8f3 / c2d4e6f8a1b3），
      # 但一直漏在 models.yaml 之外 —— 真实表与生成的 ORM 模型因此长期不一致。
      # Go 网关直接写 SQL 不受影响，Python 侧经 ORM 读取则拿不到这些列。
      kb_id:
        type: string
        description: 默认知识库 ID（派发时用于 RAG 检索）
        nullable: true
      skills:
        type: object
        db_type: jsonb
        description: 技能名数组（派发时只启用这些技能）
        default: '[]'
      plugins:
        type: object
        db_type: jsonb
        description: MCP server 名数组（派发时只放这些插件提供的工具）
        default: '[]'
      workflows:
        type: object
        db_type: jsonb
        description: 工作流 ID 数组（派发时按顺序执行）
        default: '[]'

  SubagentRun:
    table: subagent_runs
    orm: true
    description: 子 Agent 运行（run 级元数据 + L1 精简摘要）
    properties:
      id:
        type: string
        maxLength: 64
        description: 运行 ID（rs_ 前缀）
        primary_key: true
      root_session_id:
        type: string
        maxLength: 128
        description: 归属会话 ID（递归树根）
      turn_id:
        type: string
        maxLength: 64
        description: 归属回合 ID（计费归因）
        nullable: true
      parent_run_id:
        type: string
        maxLength: 64
        description: 父运行 ID（顶层委派为空）
        nullable: true
      depth:
        type: integer
        description: 递归深度（顶层为 1）
        default: 1
      tenant_id:
        type: string
        maxLength: 36
        description: 租户 ID
        nullable: true
      user_id:
        type: string
        maxLength: 36
        description: 用户 ID
        nullable: true
      agent_id:
        type: string
        maxLength: 36
        description: Profile 引用（agents.id）
        foreign_key: true
        fk_table: agents
        fk_column: id
        nullable: true
      profile_name:
        type: string
        maxLength: 128
        description: Profile 名（冗余，便于展示与审计）
        nullable: true
      task:
        type: text
        description: 委派任务原文
      status:
        type: string
        maxLength: 16
        description: 状态（queued/running/completed/failed/cancelled/timeout/budget_exceeded）
      summary:
        type: text
        description: L1 有效消息（经 LLM 整理，唯一进入父上下文的内容）
        nullable: true
      summary_format:
        type: string
        maxLength: 16
        description: 摘要格式
        default: markdown
      artifacts:
        type: object
        db_type: jsonb
        description: 产物引用（[{path,bytes}]）
        default: '[]'
      write_paths:
        type: object
        db_type: jsonb
        description: 写入路径声明（并发互斥用）
        default: '[]'
      read_only:
        type: boolean
        description: 是否只读运行（剥离写工具）
        default: false
      input_tokens:
        type: integer
        db_type: bigint
        description: 输入 Tokens
        default: 0
      output_tokens:
        type: integer
        db_type: bigint
        description: 输出 Tokens
        default: 0
      steps:
        type: integer
        description: 步数
        default: 0
      cost_cents:
        type: integer
        description: 费用（分）
        default: 0
      redacted_count:
        type: integer
        description: 入库前命中的敏感片段数
        default: 0
      error:
        type: text
        description: 失败原因（不静默）
        nullable: true
      started_at:
        type: string
        format: date-time
        description: 开始时间
        nullable: true
      finished_at:
        type: string
        format: date-time
        description: 结束时间
        nullable: true
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()

      inherited_messages:
        type: integer
        description: fork 时继承的历史消息条数（审计，迁移 0004）
        default: 0
      retryable:
        type: boolean
        description: 这次失败是否值得重试（与 error 文本分开，迁移 0006）
        default: false
      output_bytes:
        type: integer
        db_type: bigint
        description: 产出体量（字节数，迁移 0006）
        default: 0
      validator_mode:
        type: string
        maxLength: 16
        description: 收尾校验模式（迁移 0006）
        nullable: true
      validator_outcome:
        type: string
        maxLength: 16
        description: 收尾校验结论（迁移 0006）
        nullable: true
      validator_attempt:
        type: integer
        description: 收尾校验尝试次数（迁移 0006）
        default: 0
      error_code:
        type: string
        maxLength: 32
        description: 机器可读的失败码（迁移 0007）
        nullable: true
      rerun_of:
        type: string
        maxLength: 64
        description: 该 run 是对哪个 run 的重跑（迁移 0006）
      resumed_from:
        type: string
        maxLength: 64
        description: 该 run 是从哪个 run 续跑 / 分叉而来（R5(b)，迁移 0008）
        nullable: true
      resume_at_step:
        type: integer
        description: 分叉点（只继承 seq < 该值的步骤；NULL = 续到底）（R5(b)，迁移 0008）
        nullable: true
  SubagentRunStep:
    table: subagent_run_steps
    orm: true
    description: 子 Agent 完整调用过程（L0 逐 step）
    properties:
      id:
        type: integer
        description: 自增 ID
        primary_key: true
        autoincrement: true
        db_type: bigserial
      run_id:
        type: string
        maxLength: 64
        description: 所属运行 ID
        foreign_key: true
        fk_table: subagent_runs
        fk_column: id
      seq:
        type: integer
        description: 步序（run 内唯一）
      kind:
        type: string
        maxLength: 16
        description: 步骤类型（message/reasoning/tool_call/tool_result/notice/error）
      role:
        type: string
        maxLength: 16
        description: 消息角色
        nullable: true
      tool_name:
        type: string
        maxLength: 64
        description: 工具名
        nullable: true
      tool_call_id:
        type: string
        maxLength: 128
        description: 工具调用 ID
        nullable: true
      content:
        type: text
        description: 单步内容（截断上限 32KB）
        nullable: true
      truncated:
        type: boolean
        description: 内容是否被截断
        default: false
      input_tokens:
        type: integer
        description: 输入 Tokens
        default: 0
      output_tokens:
        type: integer
        description: 输出 Tokens
        default: 0
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()

  MediaAsset:
    table: media_assets
    orm: true
    description: 媒体资源
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 资源 ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      user_id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
      type:
        type: string
        maxLength: 16
        description: 类型
        default: 'text'
      name:
        type: string
        maxLength: 255
        description: 名称
      file_url:
        type: string
        maxLength: 1024
        description: 文件 URL
        default: ''
      file_path:
        type: string
        maxLength: 512
        description: 文件路径
        default: ''
      mime_type:
        type: string
        maxLength: 64
        description: MIME 类型
        default: ''
      thumbnail:
        type: string
        maxLength: 512
        description: 缩略图
        default: ''
      metadata:
        type: object
        description: 元数据（JSONB）
        default: '{}'
      tags:
        type: array
        description: 标签
        default: '[]'
      category:
        type: string
        maxLength: 64
        description: 分类
        default: ''
      size:
        type: integer
        description: 文件大小
        db_type: bigint
        default: 0
      created_at:
        type: datetime
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: datetime
        format: date-time
        description: 更新时间
        default: now()
      parent_id:
        type: string
        maxLength: 64
        description: 父资源 ID
        default: ''

  ToolCall:
    table: tool_calls
    orm: true
    description: 工具调用记录
    properties:
      id:
        type: string
        maxLength: 36
        description: 调用 ID
        primary_key: true
        default: gen_random_uuid()
      session_id:
        type: string
        format: uuid
        maxLength: 36
        description: 会话 ID
      message_id:
        type: string
        format: uuid
        maxLength: 36
        description: 消息 ID
        nullable: true
      tool_name:
        type: string
        maxLength: 128
        description: 工具名称
      input:
        type: object
        description: 输入参数（JSONB）
        default: '{}'
      output:
        type: text
        description: 输出结果
        default: ''
      is_error:
        type: boolean
        description: 是否有错误
        default: false
      duration_ms:
        type: integer
        description: 耗时（毫秒）
        db_type: bigint
        default: 0
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      turn_id:
        type: string
        format: uuid
        maxLength: 36
        description: 所属回合 ID（turn 一致性：消息/工具/计费同回合可幂等叙事）
        nullable: true

  User:
    table: users
    orm: true
    description: 用户
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      email:
        type: string
        maxLength: 255
        description: 邮箱
      name:
        type: string
        maxLength: 128
        description: 名称
      password_hash:
        type: string
        maxLength: 255
        description: 密码哈希
      role:
        type: string
        maxLength: 16
        description: 角色
        default: 'user'
      storage_id:
        type: string
        maxLength: 64
        description: 存储 ID
        nullable: true
        unique: true
      credits:
        type: integer
        description: Credits 余额
        default: 1000
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()
      phone:
        type: string
        maxLength: 32
        description: 手机号
        nullable: true
      password_set:
        type: boolean
        description: 是否已设置密码
        default: true
      settings:
        type: object
        description: 用户设置（JSONB）
        default: '{}'

  AgentSession:
    table: agent_sessions
    orm: true
    description: Agent 会话
    properties:
      id:
        type: string
        maxLength: 128
        description: 会话 ID
        primary_key: true
      user_id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
        foreign_key: true
        fk_table: users
        fk_column: id
      agent_id:
        type: string
        format: uuid
        maxLength: 36
        description: Agent ID
        foreign_key: true
        fk_table: agents
        fk_column: id
        nullable: true
      name:
        type: string
        maxLength: 128
        description: 会话名称
      task:
        type: text
        description: 任务描述
      status:
        type: string
        maxLength: 16
        description: 状态
        default: 'pending'
      result:
        type: text
        description: 结果
        nullable: true
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id

  ApiKey:
    table: api_keys
    orm: true
    description: API 密钥
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 密钥 ID
        primary_key: true
        default: gen_random_uuid()
      user_id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
        foreign_key: true
        fk_table: users
        fk_column: id
      name:
        type: string
        maxLength: 128
        description: 名称
      key_hash:
        type: string
        maxLength: 64
        description: 密钥哈希
      last_used_at:
        type: string
        format: date-time
        description: 最后使用时间
        nullable: true
      expires_at:
        type: string
        format: date-time
        description: 过期时间
        nullable: true
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      revoked:
        type: boolean
        description: 是否已撤销
        default: false

  AuditLog:
    table: audit_logs
    orm: true
    description: 审计日志
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 日志 ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      user_id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
        foreign_key: true
        fk_table: users
        fk_column: id
        nullable: true
      action:
        type: string
        maxLength: 64
        description: 操作类型
      resource_type:
        type: string
        maxLength: 64
        description: 资源类型
      resource_id:
        type: string
        maxLength: 64
        description: 资源 ID
        nullable: true
      details:
        type: object
        description: 详细信息（JSONB）
        default: '{}'
      ip_address:
        type: string
        maxLength: 45
        description: IP 地址
        nullable: true
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()

  CreditTransaction:
    table: credit_transactions
    orm: true
    description: Credits 交易记录
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 交易 ID
        primary_key: true
        default: gen_random_uuid()
      user_id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
        foreign_key: true
        fk_table: users
        fk_column: id
      amount:
        type: integer
        description: 金额
      balance:
        type: integer
        description: 余额
      reason:
        type: string
        maxLength: 64
        description: 原因
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      turn_id:
        type: string
        format: uuid
        maxLength: 36
        description: 所属回合 ID（幂等扣费键：同一 turn 只扣一次）
        nullable: true

  KnowledgeBase:
    table: knowledge_bases
    orm: true
    description: 知识库
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 知识库 ID
        primary_key: true
        default: gen_random_uuid()
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      user_id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
        foreign_key: true
        fk_table: users
        fk_column: id
      name:
        type: string
        maxLength: 255
        description: 名称
      description:
        type: text
        description: 描述
        nullable: true
      provider:
        type: string
        maxLength: 16
        description: 检索 provider（selfhosted | cloud）
      visibility:
        type: string
        maxLength: 32
        description: 可见性
        default: 'private'
      status:
        type: string
        maxLength: 32
        description: 状态（disabled | indexing | ready | error）
        default: 'disabled'
      document_count:
        type: integer
        description: 文档数量
        nullable: true
      total_size_bytes:
        type: integer
        description: 总大小（字节）
        db_type: bigint
        nullable: true
      credits_consumed:
        type: integer
        description: 已消耗 Credits
        nullable: true
      config:
        type: object
        description: JSON 配置
        default: '{}'
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()
      index_ref:
        type: string
        maxLength: 255
        description: provider 侧的索引位置（自托管=索引目录，cloud=folder_id）
        nullable: true
      index_engine:
        type: string
        maxLength: 64
        description: 建立该库索引时的检索引擎版本（如 pageindex==0.4.4）；与当前镜像不一致 ⇒ 需重建
        nullable: true
      error_message:
        type: text
        description: 最近一次错误
        nullable: true

  KnowledgeDocument:
    table: knowledge_documents
    orm: true
    description: 知识库文档
    properties:
      id:
        type: string
        format: uuid
        maxLength: 36
        description: 文档 ID
        primary_key: true
        default: gen_random_uuid()
      knowledge_base_id:
        type: string
        format: uuid
        maxLength: 36
        description: 知识库 ID
        foreign_key: true
        fk_table: knowledge_bases
        fk_column: id
      tenant_id:
        type: string
        format: uuid
        maxLength: 36
        description: 租户 ID
        foreign_key: true
        fk_table: tenants
        fk_column: id
      user_id:
        type: string
        format: uuid
        maxLength: 36
        description: 用户 ID
        foreign_key: true
        fk_table: users
        fk_column: id
      name:
        type: string
        maxLength: 255
        description: 文档名称
      storage_key:
        type: string
        maxLength: 512
        description: 原文在对象存储中的 key（不含 bucket）
        nullable: true
      file_type:
        type: string
        maxLength: 32
        description: 文件类型
        nullable: true
      file_size_bytes:
        type: integer
        description: 文件大小
        db_type: bigint
        nullable: true
        default: 0
      page_count:
        type: integer
        description: 页数（PageIndex 为页级索引）
        nullable: true
        default: 0
      status:
        type: string
        maxLength: 16
        description: 状态（pending | indexing | ready | error）
        default: 'pending'
      pageindex_doc_id:
        type: string
        maxLength: 64
        description: PageIndex 侧的文档 ID
        nullable: true
      error_message:
        type: text
        description: 错误信息
        nullable: true
      metadata:
        type: object
        description: 元数据（JSONB）
        default: '{}'
      created_at:
        type: string
        format: date-time
        description: 创建时间
        default: now()
      updated_at:
        type: string
        format: date-time
        description: 更新时间
        default: now()

  UserKnowledgeSetting:
    table: user_knowledge_settings
    orm: true
