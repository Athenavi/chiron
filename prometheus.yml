# Chiron 监控抓取配置
# docker-compose 的 prometheus 服务把它挂载到 /etc/prometheus/prometheus.yml,
# 同时挂载 ./prometheus_alerts.yml 到 /etc/prometheus/alerts.yml(由 rule_files 加载)。
# alertmanager.yml 是 alertmanager 服务自己的配置,不在此引用。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 网关指标。gateway 不发布宿主机端口,容器网络内用服务名 gateway:8080 抓取。
  # 多副本必须用 dns_sd_configs:static_configs 只会把服务名解析成**一个**地址
  # (--scale gateway=N 时 Prometheus 只看得到其中一个副本,副本级告警与 SSE 背压
  #  指标 sse_publish_* 会失真)。K8s 生产改用 kubernetes_sd_configs;
  # 外部 LB / 服务注册场景用 file_sd 或对应 SD。
  # 鉴权:网关 /metrics 在未配置 METRICS_TOKEN 时要求 JWT admin 权限,
  # 因此 compose 把同一个 METRICS_TOKEN 同时传给 gateway 和 prometheus(见 docker-compose.yml)。
  # 未设置该变量时抓取会返回 401(job 失败但不影响 Prometheus 启动),生产环境必须设置。
  - job_name: chiron-gateway
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: ${METRICS_TOKEN}
    dns_sd_configs:
      - names: ["gateway"]
        type: A
        port: 8080

  # 引擎侧指标。此前**完全没有采集**：队列积压（queue_depth）、DLQ 增长
  # （queue_dlq_total）、重试（queue_retry_total）、处理时长、租户 token 预算
  # 都只存在于进程内，扩展性测试时看不到任何队列行为 —— 等于盲测。
  # job 名必须叫 python-engine：prometheus_alerts.yml 的 PythonEngineDown /
  # HighPythonMemoryUsage 就是按这个名字写的（此前那条告警不可能成立）。
  # /metrics 在引擎的 middleware 白名单里，不需要令牌（生产请用网络策略限制来源）。
  - job_name: python-engine
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["python-engine"]
        type: A
        port: 8000

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
