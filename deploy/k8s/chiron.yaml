# Chiron 本地 K8s 验证清单（Deployment / 探针 / PDB / HPA / 滚动升级）
#
# 刻意**不在这里重建 PostgreSQL / Redis / MinIO**：本机 compose 里那套已经在跑，
# Pod 通过 host.docker.internal 直连即可（Docker Desktop 会注入这个域名）。
# 这样把变量收敛到"编排层"，才能干净地验证扩展性。
#
# 镜像：kind load 之后用 imagePullPolicy: Never，避免去拉不存在的远端镜像。
---
apiVersion: v1
kind: Namespace
metadata:
  name: chiron
---
# 副本之间共享的卷（sandbox / plugins 都挂它）。**必须是 RWX** —— 每个副本要同时读写同一份。
# 前提：集群有支持 ReadWriteMany 的 provisioner。kind 自带的 local-path 只支持 RWO，
# 本地验证前需装 nfs-server-provisioner，否则挂它的 Pod 会一直 Pending（详见 README 第 6 节）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chiron-shared
  namespace: chiron
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chiron-config
  namespace: chiron
data:
  # ── 基础设施（指向宿主机上已在跑的那套）──
  REDIS_ADDR: "host.docker.internal:6379"
  REDIS_URL: "redis://host.docker.internal:6379/0"
  # 三个副本必须同值：它决定键空间前缀，不一致会导致"同一个会话在两套键里"
  REDIS_KEY_PREFIX: "chiron:"
  # ── 引擎 ──
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "8000"
  GATEWAY_INTERNAL_URL: "http://gateway:8080"
  SANDBOX_ROOT: "/srv/chiron/sandbox"
  # 独立沙箱执行（引擎默认 backend=service 且 **fail-closed**）：URL 指向下面的 sandbox-lb Service。
  # 缺该服务或未设这两项时，引擎会因探测 `http://sandbox-lb:8001/v1/internal/exec/health`
  # 失败而**拒绝启动**（与 docs/deployment-multi-instance.md §4 一致）。
  SANDBOX_BACKEND: "service"
  SANDBOX_SERVICE_URL: "http://sandbox-lb:8001"
  SANDBOX_SERVICE_TENANTS: ""   # 空 = 全部租户走沙箱服务；填名单则仅名单内走服务
  PLUGIN_DATA_DIR: "/srv/chiron/plugins"
  # 内置技能资产（market/skills）：引擎镜像只 COPY app/，market/ 进不去 ⇒ 靠只读挂载 +
  # 这个变量提供。卷由下面的 python-engine Deployment 提供（默认 emptyDir，见 README 第 6 节）。
  CHIRON_BUILTIN_SKILLS_PATH: "/srv/chiron/builtin-skills"
  # 每副本连接预算：docs/deployment-multi-instance.md 的公式
  #   N_gateway × POSTGRES_MAX_CONN + M_engine × DB_POOL_MAX_SIZE ≤ PG max_connections
  # 3+3 副本、PG 默认 100 连接 → 每侧 10 才安全。
  DB_POOL_MAX_SIZE: "10"
  POSTGRES_MAX_CONN: "10"
  # ── 网关 ──
  PORT: "8080"
  STORAGE_BACKEND: "local"
  STORAGE_ROOT: "/srv/chiron/workspace"
---
# 敏感项单独放 Secret。**不要提交真实值** —— 用下面的命令从 .env 注入：
#   kubectl -n chiron create secret generic chiron-secrets \
#     --from-literal=APP_SECRET="$(grep -E '^APP_SECRET=' .env | cut -d= -f2-)" \
#     --from-literal=JWT_SECRET="$(grep -E '^JWT_SECRET=' .env | cut -d= -f2-)" \
#     --from-literal=INTERNAL_TOKEN="$(grep -E '^INTERNAL_TOKEN=' .env | cut -d= -f2-)" \
#     --from-literal=POSTGRES_DSN="$(grep -E '^POSTGRES_DSN=' .env | cut -d= -f2- | sed 's/@localhost/@host.docker.internal/')" \
#     --from-literal=METRICS_TOKEN="$(grep -E '^METRICS_TOKEN=' .env | cut -d= -f2-)" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: chiron-secrets
  namespace: chiron
type: Opaque
stringData:
  APP_SECRET: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  INTERNAL_TOKEN: "REPLACE_ME"
  POSTGRES_DSN: "postgresql://postgres@host.docker.internal:5432/chiron0915"
  METRICS_TOKEN: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: chiron
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    # maxUnavailable: 0 → 滚动升级期间始终有满额副本在服务（验证"无缝"）
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: chiron/gateway:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: chiron-config }
            - secretRef: { name: chiron-secrets }
          # 就绪看依赖（PG+Redis），存活只看进程 —— 这是两者语义的正确用法：
          # 依赖抖动应该"摘流量"，而不是"重启容器"。
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: chiron
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: chiron
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: gateway }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-engine
  namespace: chiron
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: python-engine }
  template:
    metadata:
      labels: { app: python-engine }
    spec:
      terminationGracePeriodSeconds: 30   # 与 compose 的 stop_grace_period 对齐（worker 排空 in-flight）
      # 多副本尽量分散到不同节点：每个引擎副本都持有活跃会话的 run 现场
      # （审批/取消的亲和目标），全部挤在一个节点等于把副本数变成单点。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: python-engine }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: python-engine
          image: chiron/python-engine:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: chiron-config }
            - secretRef: { name: chiron-secrets }
          env:
            # 实例身份 + 自注册地址：多副本下 run 归属路由（approval/cancel 的亲和）
            # 依赖这两个值。用 POD_NAME + POD_IP 注入 —— 写死会退化成一致性哈希，
            # 引擎启动日志会给出明确告警。
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: ENGINE_ADVERTISE_URL
              value: "http://$(POD_IP):8000"
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: sandbox, mountPath: /srv/chiron/sandbox }
            - { name: plugins, mountPath: /srv/chiron/plugins }
            - { name: builtin-skills, mountPath: /srv/chiron/builtin-skills, readOnly: true }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 2000m, memory: 2Gi }
      volumes:
        # sandbox 与 plugins 必须由副本之间**共享**（见 docs/deployment-multi-instance.md）：
        # 否则同一用户的任务落到不同副本时看不到彼此写入的文件（agent 文件工作流"间歇性失忆"）。
        #
        # 这里引用同一条 **RWX** PVC。前提是集群有支持 ReadWriteMany 的 provisioner ——
        # kind 自带的 local-path **只支持 RWO**，直接 apply 会让挂它的 Pod 卡在 Pending。
        # 本地验证要么先装 nfs-server-provisioner，要么把下面两处临时改回 `emptyDir: {}`。
        - name: sandbox
          persistentVolumeClaim: { claimName: chiron-shared }
        - name: plugins
          persistentVolumeClaim: { claimName: chiron-shared }
        # 内置技能（market/skills）：默认空 —— 要内置技能就把它换成 hostPath / PVC
        # 挂载（见 README 第 6 节「已知约束」）。
        - name: builtin-skills
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: python-engine
  namespace: chiron
spec:
  # 不加 NodePort：引擎只被网关调用；但 headless（clusterIP: None）更贴近真实拓扑，
  # 便于按 Pod IP 直连做单副本调试。
  clusterIP: None
  selector: { app: python-engine }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: python-engine
  namespace: chiron
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: python-engine }
---
# HPA 需要 metrics-server（kind 默认没有）：
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   kubectl -n kube-system patch deployment metrics-server --type=json \
#     -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: chiron
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 3
  maxReplicas: 6
  metrics:
    # CPU + 内存双指标：LLM 工作负载以 IO/等待为主，单看 CPU 可能长期偏低而该扩不扩；
    # 内存能反映连接 / 会话 / 缓冲的堆积。更精确的「按并发/队列长度」伸缩需要
    # prometheus-adapter 暴露自定义指标（见 docs/deployment-multi-instance.md §5）。
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-engine
  namespace: chiron
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: python-engine }
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
---
# ═══════════════════════════════════════════════════════════════════════════
# 沙箱执行服务（S5-(e) 的 B 层）—— 引擎默认 SANDBOX_BACKEND=service 且 **fail-closed**
#
# 引擎启动会探测 SANDBOX_SERVICE_URL（= 下面的 sandbox-lb Service）的
# /v1/internal/exec/health；不可达且 DEGRADED_MODE=false ⇒ **拒绝启动**。
# 因此本组资源与 python-engine 是**硬依赖**，不能省 —— 此前清单里没有它们，
# python-engine 会因探测失败而 CrashLoop（与 README「3+3 全 Ready」矛盾）。
#
# 代码来源：复用引擎镜像（与 app/tools/sandbox.py **同一份**白名单实现），服务入口
# `sandbox-service/service.py` 由 ConfigMap 只读挂入 —— 不在这里内嵌，避免与仓库里的
# 源文件漂移。创建命令见 deploy/k8s/README.md（用 kubectl create configmap --from-file）。
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-service
  namespace: chiron
spec:
  replicas: 1
  selector:
    matchLabels: { app: sandbox-service }
  template:
    metadata:
      labels: { app: sandbox-service }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: sandbox-service
          image: chiron/python-engine:dev
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn", "service:app", "--host", "0.0.0.0", "--port", "8001"]
          ports: [{ containerPort: 8001 }]
          env:
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: chiron-secrets, key: INTERNAL_TOKEN } }
            - name: SANDBOX_ROOT
              value: /srv/chiron/sandbox
            # app/tools/__init__.py 在**模块级**对相对路径建目录，而本容器根是只读 —— 落到可写的 emptyDir。
            - name: MEDIA_STORE_PATH
              value: /tmp/chiron-media
            - name: SKILL_STORE_PATH
              value: /tmp/chiron-skills
            # 沙箱是最脆弱的容器，不该持有能签发 JWT 的密钥 —— 用固定占位值（本服务不签发也不校验 JWT）。
            - name: JWT_SECRET
              value: sandbox-placeholder-secret-not-used-for-jwt-32b
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            # 审计集中摄取：只读根下无法落盘，必须外发到网关（网关已在 default 网络可达）。
            - name: EXEC_AUDIT_SHIP_URL
              value: http://gateway:8080/v1/internal/audit/exec
          # ── 隔离强化（与 compose 的 sandbox-service 段对齐）──
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          volumeMounts:
            # 服务代码：只读挂入 ConfigMap（chiron-sandbox-code，见 README 的创建命令）。
            - { name: sandbox-code, mountPath: /app/service.py, subPath: service.py, readOnly: true }
            - { name: sandbox, mountPath: /srv/chiron/sandbox }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            # 用 exec + 环境里的 INTERNAL_TOKEN：httpGet 的头**不支持** secretKeyRef。
            exec:
              command:
                - python
                - -c
                - "import os,urllib.request;r=urllib.request.Request('http://localhost:8001/v1/internal/exec/health',headers={'X-Internal-Token':os.environ.get('INTERNAL_TOKEN','')});urllib.request.urlopen(r)"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
      volumes:
        - name: sandbox-code
          configMap: { name: chiron-sandbox-code }
        # SANDBOX_ROOT 必须是**与引擎同一条** RWX PVC：否则 agent 在引擎侧用文件工具
        # 写进 workspace 的内容，沙箱侧看不到 —— run_in_sandbox 读到空目录，任务以
        # "文件不存在"失败（或被降级路径吞掉）。上面 python-engine 的 sandbox 卷已换成
        # chiron-shared，这里必须跟上，否则两侧根本不是同一份 workspace。
        # 同前：kind 自带 local-path 只支持 RWO，本地验证需先装 nfs-server-provisioner。
        - name: sandbox
          persistentVolumeClaim: { claimName: chiron-shared }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-service
  namespace: chiron
spec:
  # headless：让 sandbox-lb 的 nginx 经 DNS 拿到**每个 Pod** 的地址（再自行 least_conn）。
  clusterIP: None
  selector: { app: sandbox-service }
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
# sandbox-service 的 L7 负载均衡（least_conn）—— 引擎的 SANDBOX_SERVICE_URL 指向它。
# 配置来自 ConfigMap chiron-sandbox-lb-conf（内容为 deploy/k8s/sandbox-lb.conf，见 README）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-lb
  namespace: chiron
spec:
  replicas: 1
  selector:
    matchLabels: { app: sandbox-lb }
  template:
    metadata:
      labels: { app: sandbox-lb }
    spec:
      containers:
        - name: sandbox-lb
          image: nginx:1.27-alpine   # upstream 的 `resolve` 参数需要 nginx ≥ 1.27.3
          ports: [{ containerPort: 8001 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: sandbox-lb.conf, readOnly: true }
      volumes:
        - name: conf
          configMap: { name: chiron-sandbox-lb-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-lb
  namespace: chiron
spec:
  selector: { app: sandbox-lb }
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
# ═══════════════════════════════════════════════════════════════════════════
# 前端（Nginx + 构建好的 SPA）—— 对外入口。
#
# 与 compose 的 frontend 服务对应：静态资源 + 同源反代 /v1、/events、/ws、/submit、
# /cancel、/media 到 gateway Service。nginx 配置**不内嵌**（避免与仓库源文件漂移），
# 由 ConfigMap `chiron-frontend-nginx` 挂入（创建命令见 README 第 3c 节）。
#
# ⚠️ 这里只是 L7 反代 + 静态资源；**TLS 终结 / 真实负载均衡 / WAF 应由集群 Ingress 或
# 外部 LB 承担**（见 docs/deployment-multi-instance.md §1）。真实集群建议把下面 Service
# 改成 ClusterIP 并交由 Ingress 暴露。
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chiron
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: chiron/frontend:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
      volumes:
        - name: nginx-conf
          configMap: { name: chiron-frontend-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chiron
spec:
  # NodePort：kind 已把节点 30082 映射到宿主 18082（见 kind-config.yaml）。
  type: NodePort
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30082
