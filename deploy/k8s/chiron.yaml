# Chiron 本地 K8s 验证清单（Deployment / 探针 / PDB / HPA / 滚动升级）
#
# 刻意**不在这里重建 PostgreSQL / Redis / MinIO**：本机 compose 里那套已经在跑，
# Pod 通过 host.docker.internal 直连即可（Docker Desktop 会注入这个域名）。
# 这样把变量收敛到"编排层"，才能干净地验证扩展性。
#
# 镜像：kind load 之后本地已有镜像，用 imagePullPolicy: IfNotPresent 就能复用它们，
# 同时**生产**（镜像来自 registry）也能正常拉取 —— 原先写死 `Never` 只在 kind 可用，
# 换到真集群会因为"本地没有该镜像"而永远 ErrImageNeverPull。
#
# ⚠ 生产必须把 `:dev` 换成 `image@sha256:<digest>`（或语义化且**不覆盖**的 tag）。
#   `:dev` 是可被覆盖的浮动标签，配 IfNotPresent ⇒ 节点上命中的旧层永远不会刷新，
#   "镜像已重建、Pod 仍在跑旧的"这类问题完全无声（kubectl 看到的 image 字符串也没变）。
#   换成 digest 后 IfNotPresent 是**正确**的取值（内容不会变，无需每次重拉）。
#
#   本文件里一共 5 处 `:dev`，**漏一处就等于一半副本跑旧代码**：
#     1. gateway            ← chiron/gateway:dev
#     2. python-engine      ← chiron/python-engine:dev
#     3. sandbox-service    ← chiron/python-engine:dev  ⚠ 与 2 是**同一个镜像**，
#        必须替换成**同一个 digest**：两边跑同一份 app/tools/sandbox.py 白名单实现，
#        digest 不一致时会"引擎放行、沙箱拒绝"或反之，表现为随机的 [blocked] 命令。
#     4. frontend           ← chiron/frontend:dev
#     5. migrate-job.yaml   ← chiron/migrations:dev（另一个文件，别忘）
#   具体替换步骤见 README §2「生产：把 :dev 换成 digest」。
---
apiVersion: v1
kind: Namespace
metadata:
  name: chiron
---
# 副本之间共享的卷（sandbox / plugins 都挂它）。**必须是 RWX** —— 每个副本要同时读写同一份。
# 前提：集群有支持 ReadWriteMany 的 provisioner。kind 自带的 local-path 只支持 RWO，
# 本地验证前需装 nfs-server-provisioner，否则挂它的 Pod 会一直 Pending（详见 README 第 6 节）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chiron-shared
  namespace: chiron
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chiron-config
  namespace: chiron
data:
  # ── 基础设施（指向宿主机上已在跑的那套）──
  REDIS_ADDR: "host.docker.internal:6379"
  # 刻意**不在这里写 REDIS_URL**：引擎只认 REDIS_URL，而带密码的 URL 必须来自 Secret。
  # 若这里也放一份，两份同名键会靠 envFrom 的先后顺序隐式覆盖 —— 顺序一调就是
  # "连上但 NOAUTH"或"密码进了日志"的隐性事故。唯一来源见 Secret 的 REDIS_URL。
  # 三个副本必须同值：它决定键空间前缀，不一致会导致"同一个会话在两套键里"
  REDIS_KEY_PREFIX: "chiron:"
  # ── 引擎 ──
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "8000"
  GATEWAY_INTERNAL_URL: "http://gateway:8080"
  SANDBOX_ROOT: "/srv/chiron/sandbox"
  # 独立沙箱执行（引擎默认 backend=service 且 **fail-closed**）：URL 指向下面的 sandbox-lb Service。
  # 缺该服务或未设这两项时，引擎会因探测 `http://sandbox-lb:8001/v1/internal/exec/health`
  # 失败而**拒绝启动**（与 docs/deployment-multi-instance.md §4 一致）。
  SANDBOX_BACKEND: "service"
  SANDBOX_SERVICE_URL: "http://sandbox-lb:8001"
  SANDBOX_SERVICE_TENANTS: ""   # 空 = 全部租户走沙箱服务；填名单则仅名单内走服务
  PLUGIN_DATA_DIR: "/srv/chiron/plugins"
  # 内置技能资产（market/skills）：引擎镜像只 COPY app/，market/ 进不去 ⇒ 靠只读挂载 +
  # 这个变量提供。卷由下面的 python-engine Deployment 提供（默认 emptyDir，见 README 第 6 节）。
  CHIRON_BUILTIN_SKILLS_PATH: "/srv/chiron/builtin-skills"
  # 每副本连接预算：docs/deployment-multi-instance.md 的公式
  #   N_gateway × POSTGRES_MAX_CONN + M_engine × DB_POOL_MAX_SIZE ≤ PG max_connections
  # ⚠ 这条公式只描述**直连 PG** 的情形。本清单的两个 HPA 允许各扩到 6：
  #   6×10 + 6×10 = 120 > PG 默认 100 ⇒ 必须经 PgBouncer（见下方 pgbouncer 段）。
  #   接入后 PG 侧只看到 default_pool_size（固定 25 × 2 副本 = 50），副本数不再放大连接。
  #   切换只要把应用侧 POSTGRES_DSN 指向 pgbouncer:6432。
  DB_POOL_MAX_SIZE: "10"
  POSTGRES_MAX_CONN: "10"
  # PgBouncer 的 transaction 池下 asyncpg 的 statement cache 必须关：
  # 否则 prepared statement 会在 server 连接被复用时错配（"prepared statement does not exist"）。
  PG_STATEMENT_CACHE_SIZE: "0"
  # ── 网关 ──
  PORT: "8080"
  STORAGE_BACKEND: "local"
  STORAGE_ROOT: "/srv/chiron/workspace"
---
# ⚠ **这里刻意不再内联 Secret 资源。**
#
# 原清单用 `stringData` 写了 APP_SECRET/JWT_SECRET/...: "REPLACE_ME" 作为占位。而
# README §3 的流程是**先** `kubectl create secret generic chiron-secrets ...`（从 .env
# 注入真实值），**再** `kubectl apply -f chiron.yaml`。两者一起出现时，最后这次 apply
# 会把这些键**覆盖回 "REPLACE_ME"**：
#   - `config.Load()` 要求 APP_SECRET ≥32 字符（config/config.go），"REPLACE_ME" 只有 10
#     个字符 ⇒ 网关、引擎**全部拒绝启动**，表现为整站 CrashLoop，而日志只报
#     "APP_SECRET environment variable must be set ..."，看起来像"忘了配密钥"；
#   - 更隐蔽的情况是占位值恰好够长：副本会用一把**与既有数据不同**的密钥起来，于是
#     所有已签发的 JWT 失效、所有已加密的配置密文解不开 —— 数据没丢但全部不可读。
#
# 正确做法（README §3 有可直接复制的命令）：
#   kubectl -n chiron create secret generic chiron-secrets \
#     --from-literal=APP_SECRET=... --from-literal=JWT_SECRET=... \
#     --from-literal=INTERNAL_TOKEN=... --from-literal=POSTGRES_DSN=... \
#     --from-literal=REDIS_PASSWORD=... --from-literal=REDIS_URL=... \
#     --from-literal=METRICS_TOKEN=... [--from-literal=PGBOUNCER_USERLIST=...] \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# ⚠ 三个密钥（APP_SECRET / JWT_SECRET / INTERNAL_TOKEN）必须**所有副本同值**：
#   网关用 APP_SECRET 派生 JWT/内部令牌与配置加密密钥；一旦副本间不同值，
#   同一份 JWT 在 A 副本有效、在 B 副本 401，配置密文也无法互相解密。
#
# ⚠ PGBOUNCER_USERLIST **不放在这个 Secret 里**，而是放独立 Secret `chiron-pgbouncer`。
#   原因：下面 gateway / python-engine 用的是
#   `envFrom: secretRef: chiron-secrets` —— 它会把该 Secret 的**每一个 key** 都注入成
#   环境变量。把 pgbouncer 的 userlist（内容是 PG 角色的 SCRAM 密码）放在同一份里，
#   等于给每个应用容器多发一份它们用不到的数据库凭据：任意一个 Python 工具/插件只要
#   能读 os.environ 就能拿到它，而这条路径完全绕过审计。
#   （sandbox-service 只按 secretKeyRef 取 INTERNAL_TOKEN 一个键，但它跑的就是同一个
#   引擎镜像、能在沙箱里执行任意命令 —— 隔离原则一样适用。）
#   缺失时 pgbouncer Pod 会卡在 ContainerCreating（不是 CrashLoop，更容易被忽略）；
#   不启用 pgbouncer 就不必建这个 Secret。
#
# POSTGRES_DSN_DIRECT（迁移用的直连 DSN）**留在 chiron-secrets** 里：它与应用自己的
#   POSTGRES_DSN 指向同一个库、同一套凭据，注入到应用容器不增加暴露面。
#
# 下面各资源的 envFrom/secretKeyRef 都引用 `chiron-secrets`（pgbouncer 的 userlist 卷
# 除外，见上）—— 这个 Secret 必须由部署流程先行创建（`kubectl apply` 不会替你生成真实值）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: chiron
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    # maxUnavailable: 0 → 滚动升级期间始终有满额副本在服务（验证"无缝"）
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      # 60s（原 30s 不够）：引擎关闭要**串行**做「队列排空（worker.py 最多 30s）+
      # 后台任务（wait_background_tasks 10s）」，30s 必然被 SIGKILL 截断 —— 被截断的
      # in-flight 任务只能等 PEL 重投，存在重复执行的可能。这里同时给 preStop 留出窗口。
      terminationGracePeriodSeconds: 60
      # 多副本尽量分散到不同节点：这批副本是同构的无状态网关，全挤在一个节点等于
      # 把副本数变成单点（该节点故障 ⇒ 对外入口整体不可用）。用 preferred 而非 required：
      # 节点数少于副本数时仍能调度（required 会让多出来的 Pod 永久 Pending）。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: gateway }
                topologyKey: kubernetes.io/hostname
      # 最小加固：镜像本身已是非 root（见 Dockerfile 的 appuser:1001），这里显式钉住，
      # 避免"基础镜像换了默认 USER 就变 root"。
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: gateway
          image: chiron/gateway:dev   # ⚠ 生产必须换成不可变 tag 或 @sha256 digest；:dev 仅供 kind 本地验证（见 README）
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          lifecycle:
            preStop:
              # SIGTERM 与「从 Service 端点摘除」是并发的：没有这段等待，正在关闭的 Pod
              # 仍会在端点更新的窗口里收到新请求（表现为升级期零星的 502 / SSE 断流）。
              # 本镜像是 alpine（见 Dockerfile），`sh` 一定存在。
              exec: { command: ["sh", "-c", "sleep 5"] }
          envFrom:
            - configMapRef: { name: chiron-config }
            - secretRef: { name: chiron-secrets }
          # 就绪看依赖（PG+Redis），存活只看进程 —— 这是两者语义的正确用法：
          # 依赖抖动应该"摘流量"，而不是"重启容器"。
          # startupProbe 先于 liveness 生效（最多 60s）：启动要连 PG/Redis、校验 schema
          # 版本、探测引擎，慢启动时若只靠 liveness 的 initialDelay 会被反复杀掉重启，
          # 表现为 CrashLoopBackOff 且日志"看起来没有错"。
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          # 网关自己也读写本地盘，必须挂**共享**卷：
          #   - STORAGE_ROOT：editor/media/upload 三处 handler 都建在它之下
          #     （internal/api/gateway_router.go 的 NewEditorHandler / SetMediaRoot / NewUploadHandler）
          #   - PLUGIN_DATA_DIR：插件配置写在 {dir}/{user_id}/plugins.json（internal/api/plugin_handler.go）
          # 不挂卷的后果是多副本各自写容器可写层：A 副本上传的媒体 B 副本 404、
          # A 副本装的插件 B 副本看不到，且 Pod 重建即全丢。
          volumeMounts:
            - { name: workspace, mountPath: /srv/chiron/workspace, subPath: workspace }
            - { name: plugins, mountPath: /srv/chiron/plugins, subPath: plugins }
      volumes:
        # 与 python-engine 引用同一条 **RWX** PVC（前提同 README：集群需支持 ReadWriteMany）。
        #
        # ⚠ 两条挂载都带 subPath：它们指向**同一条 PVC 的不同子目录**。
        # 不带 subPath 时两者是同一个目录 —— workspace 是 agent 的**可写**文件区
        # （引擎把它当沙箱根），plugins 里存的是 {user_id}/plugins.json（含用户凭据）。
        # 合在一起就等于"沙箱里的任意命令都能改插件凭据"，属于横向提权。
        # 子目录需在卷上预建一次（见 deploy/k8s/README.md §3d），否则 Pod 会因
        # 无权在只挂载子目录时创建它而启动失败。
        - name: workspace
          persistentVolumeClaim: { claimName: chiron-shared }
        - name: plugins
          persistentVolumeClaim: { claimName: chiron-shared }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: chiron
spec:
  # ⚠ 刻意**不是** NodePort：网关的 mux 上同时挂着对外的 /v1/* 与内部的
  # /v1/internal/*（其中 /v1/internal/db/execute 能执行 SQL、/v1/internal/redis/*
  # 能读写 Redis），而这些"内部"端点只靠 X-Internal-Token 一道门。
  # NodePort 会把它们暴露在**每个节点 IP** 上 —— 等于把内部端点真放到了内网可达处。
  # 对外入口只保留 frontend（30082：静态资源 + 同源反代），网关只被 frontend 与
  # python-engine 访问。本地调试用：
  #   kubectl -n chiron port-forward svc/gateway 8080:8080
  type: ClusterIP
  selector: { app: gateway }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: chiron
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: gateway }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-engine
  namespace: chiron
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: python-engine }
  template:
    metadata:
      labels: { app: python-engine }
    spec:
      # 60s（原 30s）：worker 排空最多 30s + 后台任务 10s 已到 40s，30s 必被 SIGKILL 截断。
      terminationGracePeriodSeconds: 60   # 与 compose 的 stop_grace_period 对齐（worker 排空 in-flight）
      # 多副本尽量分散到不同节点：每个引擎副本都持有活跃会话的 run 现场
      # （审批/取消的亲和目标），全部挤在一个节点等于把副本数变成单点。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: python-engine }
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: python-engine
          image: chiron/python-engine:dev   # ⚠ 生产必须换成不可变 tag 或 @sha256 digest；:dev 仅供 kind 本地验证（见 README）
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          lifecycle:
            preStop:
              # 先摘流量再 SIGTERM：否则端点更新窗口内进来的新任务，会在排空开始后才到达。
              # 这段时间也算在 terminationGracePeriodSeconds 里（60s 减去它是排空余量）。
              exec: { command: ["sh", "-c", "sleep 5"] }
          envFrom:
            - configMapRef: { name: chiron-config }
            - secretRef: { name: chiron-secrets }
          env:
            # 实例身份 + 自注册地址：多副本下 run 归属路由（approval/cancel 的亲和）
            # 依赖这两个值。用 POD_NAME + POD_IP 注入 —— 写死会退化成一致性哈希，
            # 引擎启动日志会给出明确告警。
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: ENGINE_ADVERTISE_URL
              value: "http://$(POD_IP):8000"
            # ⚠ REDIS_URL 来自 Secret（envFrom 已加载），这里**不要**再覆盖：
            # 同名 env 会盖掉 Secret 里的值，而拼接出来的 URL 在密码含 `@:/` 时会被
            # 客户端解析错（表现为 NOAUTH 或连到别的库）。
            #
            # ── 媒体与技能必须落在**跨副本共享**的卷上 ──
            # 引擎的默认值分别是 ./data/media 与 ./data/skills（进程工作目录下的容器层）：
            # 一是 Pod 重建即丢，二是同一用户的请求落到不同副本就看不到彼此生成的文件
            # （表现为媒体 404 / 技能"时有时无"）。
            #
            # ⚠ 路径写法要按**本容器内**的挂载点：网关把同一条 PVC 挂在
            # /srv/chiron/workspace，而引擎挂在 /srv/chiron/sandbox —— 两者是同一个
            # PVC 根。网关的媒体根固定为 STORAGE_ROOT+"/media"（即 PVC 根/media，
            # 见 internal/api/gateway_router.go 的 SetMediaRoot），所以引擎这里必须写
            # /srv/chiron/sandbox/media；写成 /srv/chiron/workspace/media 会落到容器
            # 可写层 —— 引擎写得"成功"，网关照样 404。
            - name: MEDIA_STORE_BACKEND
              value: "local"        # 与网关的 STORAGE_BACKEND 同值；改 s3 时两处一起改
            - name: MEDIA_STORE_PATH
              value: "/srv/chiron/sandbox/media"
            - name: SKILL_STORE_PATH
              value: "/srv/chiron/plugins/skills"
          # startupProbe 必须先于 liveness 生效：引擎启动要连 PG/Redis、探测 sandbox
          # 服务、恢复 PEL 里的 in-flight 任务，冷启动可能远超 liveness 的 initialDelay；
          # 没有它时慢启动会被 liveness 反复杀掉，表现为"一直重启但日志没有报错"。
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            # subPath 必须与 gateway 一致：网关把 PVC 的 `workspace/` 挂在
            # /srv/chiron/workspace，引擎侧同一个子目录挂在 /srv/chiron/sandbox。
            # 两边不一致时引擎写到容器可写层，网关读不到（媒体 404、编辑结果丢失）。
            - { name: sandbox, mountPath: /srv/chiron/sandbox, subPath: workspace }
            - { name: plugins, mountPath: /srv/chiron/plugins, subPath: plugins }
            - { name: builtin-skills, mountPath: /srv/chiron/builtin-skills, readOnly: true }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 2000m, memory: 2Gi }
      volumes:
        # sandbox 与 plugins 必须由副本之间**共享**（见 docs/deployment-multi-instance.md）：
        # 否则同一用户的任务落到不同副本时看不到彼此写入的文件（agent 文件工作流"间歇性失忆"）。
        #
        # 这里引用同一条 **RWX** PVC。前提是集群有支持 ReadWriteMany 的 provisioner ——
        # kind 自带的 local-path **只支持 RWO**，直接 apply 会让挂它的 Pod 卡在 Pending。
        # 本地验证要么先装 nfs-server-provisioner，要么把下面两处临时改回 `emptyDir: {}`。
        - name: sandbox
          persistentVolumeClaim: { claimName: chiron-shared }
        - name: plugins
          persistentVolumeClaim: { claimName: chiron-shared }
        # 内置技能（market/skills）：默认空 —— 要内置技能就把它换成 hostPath / PVC
        # 挂载（见 README 第 6 节「已知约束」）。
        - name: builtin-skills
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: python-engine
  namespace: chiron
spec:
  # 不加 NodePort：引擎只被网关调用；但 headless（clusterIP: None）更贴近真实拓扑，
  # 便于按 Pod IP 直连做单副本调试。
  clusterIP: None
  selector: { app: python-engine }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: python-engine
  namespace: chiron
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: python-engine }
---
# HPA 需要 metrics-server（kind 默认没有）：
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   kubectl -n kube-system patch deployment metrics-server --type=json \
#     -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: chiron
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 3
  maxReplicas: 6
  metrics:
    # CPU + 内存双指标：LLM 工作负载以 IO/等待为主，单看 CPU 可能长期偏低而该扩不扩；
    # 内存能反映连接 / 会话 / 缓冲的堆积。更精确的「按并发/队列长度」伸缩需要
    # prometheus-adapter 暴露自定义指标（见 docs/deployment-multi-instance.md §5）。
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-engine
  namespace: chiron
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: python-engine }
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
---
# ── PgBouncer：把「副本数 × 池大小」的连接放大收成对 PG 的固定池 ──
#
# 为什么需要它：`POSTGRES_MAX_CONN` / `DB_POOL_MAX_SIZE` 是**每副本**的，而上面两个
# HPA 都允许扩到 6 ⇒ 6×10 + 6×10 = 120，直接越过 PostgreSQL 默认 max_connections=100。
# 接入 PgBouncer（transaction 池）后，PG 侧只看到 default_pool_size（固定），
# 副本再扩也**不**线性放大连接数。
#
# ⚠ 三个必须知道的兼容点（都已在下面或应用侧处理）：
#  1. transaction 池下**会话级 SET 不跨事务保留** —— Go 侧因此改用 startup packet
#     传三个会话超时（internal/db/postgres.go 的 sessionTimeoutParams → RuntimeParams）：
#     statement_timeout / lock_timeout / idle_in_transaction_session_timeout。
#     这三个参数 PG 都不向客户端上报，PgBouncer 只认 startup packet 里的值，且必须
#     列在 track_extra_parameters 里才会被保存并在客户端活跃时重新应用 —— 所以下面
#     三个都要写全。用 `SET` 设置它们在本模式下不生效（值不被跟踪，且
#     server_reset_query = DISCARD ALL 会清掉），慢查询/锁等待就会占住 server 连接
#     直到池被耗尽。
#  2. pgx 默认使用 prepared statements，transaction 池下必须让客户端避开它：
#     POSTGRES_DSN 里加 `default_query_exec_mode=exec`（无需改代码，pgx 认这个连接参数），
#     或依赖 PgBouncer ≥1.21 的 `max_prepared_statements`（两者都留了）。
#  3. 引擎侧 asyncpg 默认开 statement cache，必须关：`PG_STATEMENT_CACHE_SIZE=0`
#     （见 chiron-config）。
#
# 切换方式：把应用的 POSTGRES_DSN 指向 `pgbouncer:6432`。
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: chiron
data:
  pgbouncer.ini: |
    [databases]
    ; ⚠ dbname 必须与 Secret 里 POSTGRES_DSN 的库名**完全一致**（当前为 chiron）。
    ;   两边不一致时应用连 PgBouncer 会报 "database not found"；更糟的情况是
    ;   库里恰好存在同名库 —— 迁移打在 A 库、应用读写 B 库，版本闸门报 schema 不匹配。
    ;   这里用 chiron 作为**别名**（客户端连的库名）也完全可以：那就要让 POSTGRES_DSN
    ;   写 .../chiron 而把 dbname 指到真实库。二选一，改的时候两处一起改。
    ;   库名随实例（如按 .env.example 原来那个带日期的示例命名）时，**这一行必须改**。
    ;   注意 host 也要跟着改：host.docker.internal 只对 kind（Pod 跑在 Docker 里）成立。
    chiron = host=host.docker.internal port=5432 dbname=chiron

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    # 对 PG 的固定连接数：与副本数无关 —— 接入 PgBouncer 的全部意义就在这里
    default_pool_size = 25
    max_client_conn = 2000
    # 兼容点 1：会话参数跨事务保留（三个超时都要列，否则经本池时静默失效）
    track_extra_parameters = statement_timeout, lock_timeout, idle_in_transaction_session_timeout
    # 兼容点 2：≥1.21 的内置 prepared statement 支持
    max_prepared_statements = 200
    server_reset_query = DISCARD ALL
    ignore_startup_parameters = extra_float_digits
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: chiron
spec:
  # 只被集群内的 gateway / python-engine 调用，不对外暴露
  clusterIP: None
  selector: { app: pgbouncer }
  ports:
    - { name: postgres, port: 6432, targetPort: 6432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: chiron
spec:
  # PgBouncer 的连接表在内存里：加副本是"提高总池量"，不是无脑水平扩展。
  # 2 个副本 + 反亲和，配合 default_pool_size=25 ⇒ 对 PG 合计 50 连接（另留 70 给运维/迁移）。
  replicas: 2
  selector:
    matchLabels: { app: pgbouncer }
  template:
    metadata:
      labels: { app: pgbouncer }
    spec:
      # 两个副本落在同一节点不致命（各自池独立），但会一起随节点故障消失
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: pgbouncer }
                topologyKey: kubernetes.io/hostname
      # PgBouncer 镜像以非 root 用户运行（官方镜像的 uid 是 70）。显式钉住，
      # 避免基础镜像换默认 USER 后悄悄变 root。
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
      containers:
        - name: pgbouncer
          image: pgbouncer/pgbouncer:1.24.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 6432 }]
          args: ["/etc/pgbouncer/pgbouncer.ini"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # PgBouncer 没有 HTTP 端点，只能用 TCP 探针。它是 PG 的**唯一**入口，
          # 没有 liveness 的话进程卡死（连接池耗尽但端口仍 listen）不会被重启。
          # startupProbe：镜像首次启动要先读 userlist、解析 [databases] 里的主机，
          # 这期间端口还没 listen。缺它时 liveness 会在启动阶段就开始计数并重启
          # 一个**尚未开始服务**的进程 —— 而 PG 恰恰是就绪最慢的依赖。
          startupProbe:
            tcpSocket: { port: 6432 }
            periodSeconds: 2
            failureThreshold: 30   # 最多等 60s
          readinessProbe:
            tcpSocket: { port: 6432 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 6432 }
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: config, mountPath: /etc/pgbouncer/pgbouncer.ini, subPath: pgbouncer.ini, readOnly: true }
            - { name: userlist, mountPath: /etc/pgbouncer/userlist.txt, subPath: PGBOUNCER_USERLIST, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: pgbouncer-config }
        - name: userlist
          # 独立 Secret，**不要**改成 chiron-secrets：后者被网关/引擎 envFrom 整体注入，
          # 放在一起等于把 PG 角色的 SCRAM 密码发给每个应用容器（见文件头的说明）。
          secret:
            secretName: chiron-pgbouncer
            items: [{ key: PGBOUNCER_USERLIST, path: PGBOUNCER_USERLIST }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
  namespace: chiron
spec:
  # 只有 2 副本 ⇒ `kubectl drain` 会**同时**驱逐两个而无人阻止，DB 入口瞬断。
  # minAvailable: 1 让驱逐串行化（第二个 Pod 要等第一个 Ready 回填补位）。
  # 接入 pgbouncer（应用 DSN 指向 6432）后它是**唯一** DB 入口，这个 PDB 是硬要求；
  # 未接入时它不影响任何流量，留着也不会有副作用。
  minAvailable: 1
  selector:
    matchLabels: { app: pgbouncer }
---
# ═══════════════════════════════════════════════════════════════════════════
# 沙箱执行服务（S5-(e) 的 B 层）—— 引擎默认 SANDBOX_BACKEND=service 且 **fail-closed**
#
# 引擎启动会探测 SANDBOX_SERVICE_URL（= 下面的 sandbox-lb Service）的
# /v1/internal/exec/health；不可达且 DEGRADED_MODE=false ⇒ **拒绝启动**。
# 因此本组资源与 python-engine 是**硬依赖**，不能省 —— 此前清单里没有它们，
# python-engine 会因探测失败而 CrashLoop（与 README「3+3 全 Ready」矛盾）。
#
# 代码来源：复用引擎镜像（与 app/tools/sandbox.py **同一份**白名单实现），服务入口
# `sandbox-service/service.py` 由 ConfigMap 只读挂入 —— 不在这里内嵌，避免与仓库里的
# 源文件漂移。创建命令见 deploy/k8s/README.md（用 kubectl create configmap --from-file）。
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-service
  namespace: chiron
spec:
  # 单副本是**单点**：它一挂，引擎的 run_in_sandbox 全部失败（引擎侧 fail-closed，
  # 不会降级到本地执行）。2 副本 + 上面的 least_conn 才是"扩副本无缝"的前提。
  replicas: 2
  selector:
    matchLabels: { app: sandbox-service }
  template:
    metadata:
      labels: { app: sandbox-service }
    spec:
      # 引擎镜像本身就是 appuser:1001（见 Dockerfile）。这里显式钉住 uid/gid：
      # 只写 runAsNonRoot 时，挂载的 RWX 卷属主可能是 root，容器会因无写权限而
      # "跑起来但所有文件操作失败"。fsGroup 让 kubelet 把卷组改成 1001。
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: sandbox-service
          image: chiron/python-engine:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "service:app", "--host", "0.0.0.0", "--port", "8001"]
          ports: [{ containerPort: 8001 }]
          env:
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: chiron-secrets, key: INTERNAL_TOKEN } }
            - name: SANDBOX_ROOT
              value: /srv/chiron/sandbox
            # app/tools/__init__.py 在**模块级**对相对路径建目录，而本容器根是只读 —— 落到可写的 emptyDir。
            - name: MEDIA_STORE_PATH
              value: /tmp/chiron-media
            - name: SKILL_STORE_PATH
              value: /tmp/chiron-skills
            # 沙箱是最脆弱的容器，不该持有能签发 JWT 的密钥 —— 用固定占位值（本服务不签发也不校验 JWT）。
            - name: JWT_SECRET
              value: sandbox-placeholder-secret-not-used-for-jwt-32b
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            # 审计集中摄取：只读根下无法落盘，必须外发到网关（网关已在 default 网络可达）。
            - name: EXEC_AUDIT_SHIP_URL
              value: http://gateway:8080/v1/internal/audit/exec
          # ── 隔离强化（与 compose 的 sandbox-service 段对齐）──
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          volumeMounts:
            # 服务代码：只读挂入 ConfigMap（chiron-sandbox-code，见 README 的创建命令）。
            - { name: sandbox-code, mountPath: /app/service.py, subPath: service.py, readOnly: true }
            - { name: sandbox, mountPath: /srv/chiron/sandbox, subPath: workspace }
            - { name: tmp, mountPath: /tmp }
          # startupProbe 必须先于 liveness 生效：uvicorn 首次导入 app 要建目录、
          # 读 ConfigMap 里的 service.py、连 Redis；期间端口尚未 listen。
          # 没有它时 liveness 从 initialDelaySeconds 起算，20s 还没起来就被重启 ——
          # 而重启只会让冷启动重来一遍，最终 CrashLoopBackOff。
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import os,urllib.request;r=urllib.request.Request('http://localhost:8001/v1/internal/exec/health',headers={'X-Internal-Token':os.environ.get('INTERNAL_TOKEN','')});urllib.request.urlopen(r)"
            periodSeconds: 2
            failureThreshold: 30   # 最多等 60s
          readinessProbe:
            # 用 exec + 环境里的 INTERNAL_TOKEN：httpGet 的头**不支持** secretKeyRef。
            exec:
              command:
                - python
                - -c
                - "import os,urllib.request;r=urllib.request.Request('http://localhost:8001/v1/internal/exec/health',headers={'X-Internal-Token':os.environ.get('INTERNAL_TOKEN','')});urllib.request.urlopen(r)"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          # 只有 readiness 时，uvicorn 进程卡死（端口仍 listen）不会被重启 ——
          # 引擎侧的 sandbox 调用会一直挂到超时，而不是切到另一个副本。
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,urllib.request;r=urllib.request.Request('http://localhost:8001/v1/internal/exec/health',headers={'X-Internal-Token':os.environ.get('INTERNAL_TOKEN','')});urllib.request.urlopen(r)"
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: sandbox-code
          configMap: { name: chiron-sandbox-code }
        # SANDBOX_ROOT 必须是**与引擎同一条** RWX PVC：否则 agent 在引擎侧用文件工具
        # 写进 workspace 的内容，沙箱侧看不到 —— run_in_sandbox 读到空目录，任务以
        # "文件不存在"失败（或被降级路径吞掉）。上面 python-engine 的 sandbox 卷已换成
        # chiron-shared，这里必须跟上，否则两侧根本不是同一份 workspace。
        # 同前：kind 自带 local-path 只支持 RWO，本地验证需先装 nfs-server-provisioner。
        - name: sandbox
          persistentVolumeClaim: { claimName: chiron-shared }
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandbox-service
  namespace: chiron
spec:
  # 2 副本 + fail-closed（引擎侧 SANDBOX_BACKEND=service 不会降级到本地执行）：
  # 没有 PDB 时 drain 节点可以把两个副本一起端掉，`run_in_sandbox` 全部失败。
  minAvailable: 1
  selector:
    matchLabels: { app: sandbox-service }
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-service
  namespace: chiron
spec:
  # headless：让 sandbox-lb 的 nginx 经 DNS 拿到**每个 Pod** 的地址（再自行 least_conn）。
  clusterIP: None
  selector: { app: sandbox-service }
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
# sandbox-service 的 L7 负载均衡（least_conn）—— 引擎的 SANDBOX_SERVICE_URL 指向它。
# 配置来自 ConfigMap chiron-sandbox-lb-conf（内容为 deploy/k8s/sandbox-lb.conf，见 README）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-lb
  namespace: chiron
spec:
  # 单副本是**单点**：它一挂，引擎的 run_in_sandbox 全部失败（引擎侧 fail-closed）。
  # 2 副本 + least_conn 才能让"扩副本无缝"成立；nginx 自身无状态，直接加副本即可。
  replicas: 2
  selector:
    matchLabels: { app: sandbox-lb }
  template:
    metadata:
      labels: { app: sandbox-lb }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: sandbox-lb }
                topologyKey: kubernetes.io/hostname
      # nginx:alpine 的 master 进程默认以 root 起（要写 /var/cache/nginx 并切换 worker 用户），
      # 所以这里**刻意不设** runAsNonRoot —— 设了会直接起不来。改为四件事：
      #   1. 容器级丢弃全部能力、只留 NET_BIND_SERVICE（见下）；
      #   2. 禁止提权；
      #   3. seccomp 用 RuntimeDefault（此前完全没有 pod 级安全上下文）；
      #   4. 只读根文件系统做不到 —— nginx 要写 pid / cache / tmp，故不设。
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox-lb
          image: nginx:1.27-alpine   # upstream 的 `resolve` 参数需要 nginx ≥ 1.27.3
          ports: [{ containerPort: 8001 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]   # 监听 8001 本身不需要，但保留以兼容改成 80/443 的场景
          # startupProbe：镜像首次启动要解析上游 DNS，拿不到就一直在 zone 里空转。
          # 没有它时 liveness 会在启动阶段就开始计数并重启一个**正在启动**的进程，
          # 表现为 CrashLoopBackOff + 日志里只有 "nginx: started" 这类误导信息。
          startupProbe:
            httpGet: { path: /healthz, port: 8001 }
            periodSeconds: 2
            failureThreshold: 30   # 最多等 60s
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            periodSeconds: 5
          # 只有 readiness 时，nginx 进程卡死（端口仍在 listen）不会被重启。
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: sandbox-lb.conf, readOnly: true }
      volumes:
        - name: conf
          configMap: { name: chiron-sandbox-lb-conf }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandbox-lb
  namespace: chiron
spec:
  # 同 sandbox-service：它是引擎访问沙箱的**唯一**入口（SANDBOX_SERVICE_URL 只指向它，
  # 没有第二条路径），2 副本被同时驱逐会让引擎侧探测失败 ⇒ 按 fail-closed 语义直接拒绝服务。
  minAvailable: 1
  selector:
    matchLabels: { app: sandbox-lb }
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-lb
  namespace: chiron
spec:
  selector: { app: sandbox-lb }
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
# ═══════════════════════════════════════════════════════════════════════════
# 前端（Nginx + 构建好的 SPA）—— 对外入口。
#
# 与 compose 的 frontend 服务对应：静态资源 + 同源反代 /v1、/events、/ws、/submit、
# /cancel、/media 到 gateway Service。nginx 配置**不内嵌**（避免与仓库源文件漂移），
# 由 ConfigMap `chiron-frontend-nginx` 挂入（创建命令见 README 第 3c 节）。
#
# ⚠️ 这里只是 L7 反代 + 静态资源；**TLS 终结 / 真实负载均衡 / WAF 应由集群 Ingress 或
# 外部 LB 承担**（见 docs/deployment-multi-instance.md §1）。真实集群建议把下面 Service
# 改成 ClusterIP 并交由 Ingress 暴露。
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chiron
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      # 前端镜像基于 nginx:alpine，主进程需要以 root 起（要绑 80 并写 /var/cache/nginx）。
      # 因此这里**刻意不设** runAsNonRoot（设了会直接起不来），改为"能力最小化"：
      # 只留绑定特权端口这一项，其余全丢，且禁止提权。seccomp 显式钉成 RuntimeDefault，
      # 与 sandbox-lb 一致 —— 不写这一条时是否启用取决于节点/运行时默认值，不可依赖。
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: chiron/frontend:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]   # 绑定 80 端口所需，其余能力不需要
          # startupProbe：nginx 冷启动要读 ConfigMap 里的 default.conf、解析
          # kube-dns 拿到 gateway 的 Service IP。缺它时 liveness 从 10s 起算，
          # DNS 慢一点（或 kube-dns 刚重启）就会把**正在启动**的前端反复重启。
          startupProbe:
            httpGet: { path: /health, port: 80 }
            periodSeconds: 2
            failureThreshold: 30   # 最多等 60s
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 80 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
      volumes:
        - name: nginx-conf
          configMap: { name: chiron-frontend-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chiron
spec:
  # ⚠ 这是**唯一**的对外入口（静态资源 + 同源反代，网关那侧已收回 ClusterIP）。
  # NodePort 会把端口暴露在**每个节点 IP** 上 ⇒ 生产必须前置真实 LB / Ingress，
  # 或用节点防火墙把它限制在可信来源；kind 用它做本地验证（30082 → 宿主 18082）。
  type: NodePort
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30082
---
# frontend 是**唯一对外入口**：没有 PDB 时，一次 `kubectl drain` 就可能把两个副本
# 同时驱逐，表现是整站 502（网关本身还活着，但没人再转发）。minAvailable: 1 保证
# 驱逐期间始终有一个在服务。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: chiron
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: frontend }
---
# ═══════════════════════════════════════════════════════════════════════════
# 网络策略（B3）：内部特权端点的**第二道**防线
#
# 背景：网关的 mux 上同时挂着对外的 /v1/* 与内部的 /v1/internal/*（任意 SQL 执行、
# Redis 读写、媒体写入），而这些"内部"端点只靠 `X-Internal-Token` 一道门。上面已把
# gateway 的 Service 从 NodePort 收回 ClusterIP（不再暴露在节点 IP 上）；本策略再钉住
# **集群内哪些 Pod 能访问哪些 Pod** —— token 是第一道，网络是第二道。
#
# ⚠ 前提：CNI 必须支持 NetworkPolicy（Calico / Cilium 等）。kind 自带的 kindnet
# **不支持** —— apply 不报错但策略不生效，用实际连通性测试确认（见 README §5）。
# egress 刻意不限制：引擎要出网调 LLM 与对象存储，列白名单域名会把部署绑死在具体
# 供应商上，收益远小于代价。
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: chiron
spec:
  # 命名空间内所有 Pod 默认不接受任何入站：新加的服务不会因为"忘了写策略"而裸奔
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  namespace: chiron
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress]
  ingress:
    # 不限定来源：NodePort 的源地址随 CNI 的 SNAT 行为变化，写死 ipBlock 会把入口
    # 一起挡掉。对外收口靠 LB / 防火墙（见上面 Service 的注释），不靠这里。
    - ports:
        - { port: 80, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: chiron
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress]
  ingress:
    # 浏览器流量：只经 frontend 的同源反代（/v1、/events、/ws、/submit、/cancel）
    - from:
        - podSelector: { matchLabels: { app: frontend } }
      ports: [{ port: 8080, protocol: TCP }]
    # 引擎回连：/v1/internal/*、tool-authorize、执行审计摄取
    - from:
        - podSelector: { matchLabels: { app: python-engine } }
      ports: [{ port: 8080, protocol: TCP }]
    # 独立沙箱服务也把执行审计送到网关（/v1/internal/audit/exec）
    - from:
        - podSelector: { matchLabels: { app: sandbox-service } }
      ports: [{ port: 8080, protocol: TCP }]
    # kubelet 的 readiness/liveness 探针来源是**节点**而不是 Pod。多数 CNI 会放通
    # host→pod，但 Calico 的默认策略可能拦 —— 若 Pod 一直 NotReady 先查这里。
    #
    # ⚠ 不能写成"RFC1918 全段放通"：Pod 网段与 Service 网段本身就在 RFC1918 里
    #   （kind / Flannel / Calico 默认 Pod 网段 10.244.0.0/16，Service 10.96.0.0/12，
    #   部分云厂商用 192.168.0.0/16 做 Pod 网段）。全段放通等于**任意 Pod** 都能连
    #   gateway:8080，可 /v1/internal/* 恰恰要靠这一层做纵深防御 —— 那样就只剩
    #   X-Internal-Token 一道门，default-deny-ingress 名存实亡。
    #   下面用 except 把常见 Pod / Service 网段挖掉。**部署前必须按集群实际网段核对**
    #   （`kubectl cluster-info dump | grep -i cidr`，或看 CNI 的 podCIDR 配置）：
    #   对不上时这条要么漏放探针（Pod 一直 NotReady），要么又敞开了 Pod 网段。
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
            except: [10.244.0.0/16, 10.96.0.0/12]
        - ipBlock:
            cidr: 172.16.0.0/12
            except: [172.17.0.0/16]
        # 192.168 段在这里**只能整段放通**：不同集群把它用作 Pod 网段的子网各不相同，
        # 没有可通用的 except 值。若你的 Pod 网段在 192.168 内，请删掉这一条并改成
        # 只保留节点网段（例如 192.168.1.0/24），否则这道门等于开着。
        - ipBlock: { cidr: 192.168.0.0/16 }
      ports: [{ port: 8080, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: python-engine-ingress
  namespace: chiron
spec:
  podSelector:
    matchLabels: { app: python-engine }
  policyTypes: [Ingress]
  ingress:
    # 只有网关会调用引擎（含 SSE 转发）；引擎本身不对外
    # 注意这里**刻意不**为 kubelet 探针补 ipBlock：多数 CNI 放通 host→pod，而加一条
    # RFC1918 或节点网段的放行等于让整个内网都能直连引擎的 8000（含 /v1/internal/*），
    # 把"只有网关能到引擎"这条隔离直接抹掉。若你的 CNI 确实拦探针（Calico 配置了
    # host endpoint 时），**按实际节点网段**单独加一条，别用大段。
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports: [{ port: 8000, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer-ingress
  namespace: chiron
spec:
  podSelector:
    matchLabels: { app: pgbouncer }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
        - podSelector: { matchLabels: { app: python-engine } }
      ports: [{ port: 6432, protocol: TCP }]
    # 同 python-engine：不为 tcpSocket 探针补大段 ipBlock —— 那会让整个内网都能连
    # 数据库入口。CNI 拦探针时按实际节点网段单独加。
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-ingress
  namespace: chiron
spec:
  podSelector:
    matchLabels: { app: sandbox-lb }
  policyTypes: [Ingress]
  ingress:
    # 只有引擎向沙箱层发起执行请求；sandbox-lb → sandbox-service 由内部 nginx 转发
    # 同 python-engine：不为 /healthz 探针补大段 ipBlock（会放开整个内网到沙箱入口）。
    - from:
        - podSelector: { matchLabels: { app: python-engine } }
      ports: [{ port: 8001, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-service-ingress
  namespace: chiron
spec:
  podSelector:
    matchLabels: { app: sandbox-service }
  policyTypes: [Ingress]
  ingress:
    # 必须有这条：`default-deny-ingress` 对所有 Pod 生效，而 sandbox-lb 是**独立 Pod**，
    # 不会被上面的 sandbox-ingress（它只选中 sandbox-lb 自己）放行到后端。
    # 漏掉它的表现是引擎探测 /v1/internal/exec/health 超时 → SANDBOX_BACKEND=service
    # 且 DEGRADED_MODE=false ⇒ 引擎**拒绝启动**，而两边 Pod 都显示 Running。
    - from:
        - podSelector: { matchLabels: { app: sandbox-lb } }
      ports: [{ port: 8001, protocol: TCP }]
    # ⚠ 这里**不要**像 gateway-ingress 那样为探针补 ipBlock：本 Deployment 的三个探针
    # 都是 `exec`（kubelet 在容器内执行 python，不走网络），网络策略根本不参与。
    # 补一条 ipBlock 只会让整个内网/所有 Pod 都能直连这个"执行任意命令"的端点，
    # 并且绕过 sandbox-lb —— 那是比暴露 gateway 更严重的洞。
