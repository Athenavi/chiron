# sandbox-service 的内部 L7 负载均衡（K8s 版）。
#
# 与 deploy/nginx/sandbox.conf **同构**，差异只有两处（K8s 的 DNS 不是 Docker 内嵌 DNS）：
#   1. resolver 指向 kube-dns 的 ClusterIP（kind 默认 10.96.0.10；kubeadm 同为 10.96.0.10，
#      其它发行版请以 `kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'` 为准）；
#   2. upstream 用 sandbox-service 的 FQDN（跨 namespace 也能解析）。
#
# 为什么需要这一层：引擎侧 `SANDBOX_SERVICE_URL` 是**单一 URL**，而 kube-proxy 的 L4 均衡
# 对 HTTP keep-alive 无效（连接建立后一直复用同一条）⇒ 流量实际全压在一个 Pod。nginx 在这里
# 做真正的 L7 least_conn 分流。
#
# ⚠ upstream 的 `resolve` 参数需要 **nginx ≥ 1.27.3**（开源版才支持）—— 这也是镜像固定
# `nginx:1.27-alpine` 的原因。
resolver 10.96.0.10 valid=5s ipv6=off;

upstream sandbox_pool {
    zone sandbox_pool 64k;
    least_conn;
    server sandbox-service.chiron.svc.cluster.local:8001 resolve;
}

server {
    listen 8001;
    # 同时监听 IPv6：容器里 `localhost` 常优先解析到 ::1，只绑 IPv4 会让以
    # `http://localhost:8001` 形式发起的探针拿到 Connection refused。
    listen [::]:8001;

    # 执行可能很长：单次上限 120s + 排队（默认 30s），读超时要给足。
    proxy_connect_timeout 2s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 只在"请求没打进去"时换实例（连接失败/超时/5xx）—— 不改执行语义本身。
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # 给 readinessProbe 用（nginx 自身没有健康端点）。
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://sandbox_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 身份（tenant/user/session）在**请求体**里，不要在这里改写。
    }
}
