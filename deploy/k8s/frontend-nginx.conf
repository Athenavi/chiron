# 前端 nginx（K8s 版）—— 由 ConfigMap `chiron-frontend-nginx` 挂入 frontend 容器
# 的 /etc/nginx/conf.d/default.conf 覆盖镜像内那份。
#
# 与 frontend-vue/nginx.conf **同构**，差异只有 resolver 与上游地址（K8s 的 DNS 不是
# Docker 内嵌 DNS 127.0.0.11）：
#   * resolver 指向 kube-dns 的 ClusterIP —— kind 默认 10.96.0.10；其它发行版以
#     `kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'` 为准；
#   * 上游用 gateway 的 FQDN。
#
# 安全头片段 snippets/security-headers.conf 仍在镜像内（Dockerfile COPY 的），此处只覆盖
# default.conf，故 include 依旧可用。
resolver 10.96.0.10 valid=10s ipv6=off;
set $chiron_gateway gateway.chiron.svc.cluster.local:8080;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ 每个自带 add_header 的 location 都要再 include 一次安全头（nginx 的 add_header
    # 在子块出现会**完全覆盖**父级，见 security-headers.conf 的说明）。
    include snippets/security-headers.conf;

    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        include snippets/security-headers.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        include snippets/security-headers.conf;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        include snippets/security-headers.conf;
    }

    location ~* \.(woff2?|ttf|eot|otf)$ {
        expires 365d;
        add_header Cache-Control "public";
        access_log off;
        include snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # ── API 代理（同源反代到网关 Service）──
    location /v1/ {
        proxy_pass http://$chiron_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /events {
        proxy_pass http://$chiron_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /submit {
        proxy_pass http://$chiron_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /cancel {
        proxy_pass http://$chiron_gateway;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /media/ {
        proxy_pass http://$chiron_gateway;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://$chiron_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        include snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
}
