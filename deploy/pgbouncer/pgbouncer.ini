; PgBouncer 配置（compose 形态；k8s 形态见 deploy/k8s/chiron.yaml 的 pgbouncer-config ConfigMap）。
;
; 目的：把「副本数 × 池大小」的连接放大收成对 PostgreSQL 的**固定池**。
; 每副本的池（网关 POSTGRES_MAX_CONN、引擎 DB_POOL_MAX_SIZE）乘以副本数是连接数的线性放大源，
; 而 PG 的 max_connections 是硬上限。经 PgBouncer（transaction 池）后，PG 侧只看到
; default_pool_size，与副本数无关。
;
; 三处必须与部署形态匹配：
;   1. [databases] 的 host/port/dbname —— 改成你的 PostgreSQL 地址；
;   2. userlist.txt —— 放该角色的 SCRAM secret（见 userlist.example.txt），不必写明文密码；
;   3. 应用侧 POSTGRES_DSN 指向 pgbouncer:6432，并带 `default_query_exec_mode=exec`。

[databases]
chiron = host=host.docker.internal port=5432 dbname=chiron

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; transaction 池：连接在事务结束后立即归还，这才让"连接数与副本数无关"成立。
; 代价是**会话级状态不保留** —— 见下面的 track_extra_parameters，以及应用侧
; 必须关掉 prepared statement 缓存（Go: default_query_exec_mode=exec；Python: PG_STATEMENT_CACHE_SIZE=0）。
pool_mode = transaction

; 对 PG 的固定连接数（每个 (user, db) 对）。这就是接入 PgBouncer 的全部意义：
; 无论应用开多少副本、每副本池配多大，PG 侧看到的上限始终是它（再乘 PgBouncer 副本数）。
default_pool_size = 25
max_client_conn = 2000

; 网关的 AfterConnect 会执行 `SET statement_timeout = 30000`（internal/db/postgres.go）。
; transaction 池默认会连同会话状态一起重置 ⇒ 慢查询保护失效，且可能泄漏给下一个客户端。
; track_extra_parameters 让 PgBouncer 在连接复用时保住这些参数。
track_extra_parameters = statement_timeout

; PgBouncer ≥ 1.21 的内置 prepared statement 支持。即便开了它，客户端侧仍建议按上面关掉缓存：
; 生产上"偶发的 prepared statement does not exist"极难定位，不值得为省一次 parse 冒这个风险。
max_prepared_statements = 200

server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
