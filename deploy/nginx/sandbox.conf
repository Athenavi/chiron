# sandbox-service 的内部负载均衡（仅 sandbox_net，不发布端口）。
#
# ## 为什么需要这一层
#
# 引擎侧的 `SANDBOX_SERVICE_URL` 是**单一 URL**，而 Docker 内嵌 DNS 对多副本的
# round-robin 只在**建立连接**时生效 —— HTTP keep-alive 会把后续请求全部复用同一条
# 连接，于是流量实际全压在一个副本上。nginx 在这里做真正的分流。
#
# ## 为什么用 `upstream` + `resolve`（而不是变量式 `proxy_pass`）
#
# * upstream 组才有 `least_conn` 与 `proxy_next_upstream`（换实例重试）；
# * `resolve` 让 nginx 按 `resolver` 周期**重解析**服务名 ⇒ `--scale sandbox-service=N`
#   之后新副本会被自动纳入；否则只在启动时解析一次，扩容不生效。
# * 需要 **nginx ≥ 1.27.3**（开源版才支持 upstream 的 `resolve` 参数）——
#   这也是 compose 里固定 `nginx:1.27-alpine` 的原因。
resolver 127.0.0.11 valid=5s ipv6=off;

upstream sandbox_pool {
    zone sandbox_pool 64k;
    least_conn;
    server sandbox-service:8001 resolve;
}

server {
    listen 8001;
    # 同时监听 IPv6：容器里 `localhost` 常优先解析到 ::1，只绑 IPv4 会让以
    # `http://localhost:8001` 形式发起的健康检查拿到 Connection refused（实测）。
    listen [::]:8001;

    # 执行可能很长：单次上限 120s + 排队（默认 30s），读超时要给足。
    proxy_connect_timeout 2s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 只在"请求没打进去"时换实例（连接失败/超时/5xx）—— 不改执行语义本身。
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # 给 compose 的 healthcheck 用（nginx 自身没有健康端点）。
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://sandbox_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 身份（tenant/user/session）在**请求体**里，不要在这里改写。
    }
}
