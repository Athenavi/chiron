# 仅供本机验证用的 compose 覆盖文件（compose 会自动读取同目录的 override）。
#
# 目的：避开宿主上**已被占用**的端口 —— 实测 6379 被本机 Redis 占用、80 被占用。
#
# ⚠ 关键：compose 对 `ports` 这类**序列字段是「追加合并」而不是「替换」**。
#   直接写 `ports: ["127.0.0.1:16379:6379"]` 的结果是「6379 和 16379 都映射」，
#   于是照样撞上宿主已占用的 6379（实测报 bind: address already in use）。
#   必须用 `!override` 标签显式声明替换语义（Compose v2.24.4+ 支持）。
#
# 容器之间仍走服务名 + 原端口（`redis:6379`、`frontend:80`），业务行为不受影响，
# 只有从宿主访问的端口变了。不要提交到仓库（本机专用）。
services:
  redis:
    ports: !override
      - "127.0.0.1:16379:6379"
  frontend:
    ports: !override
      - "127.0.0.1:8081:80"
